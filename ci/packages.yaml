# Spack site-level packages configuration.
#
# This file is installed to the Spack site configuration directory
# (/etc/spack/packages.yaml) during the container build so that all
# environments and ad-hoc installs inherit these settings without
# needing to repeat them in every spack.yaml.
#
# Architecture-aware configuration via PHLEX_SPACK_TARGET environment
# variable (set in Dockerfile/DockerBuild):
#   - amd64: x86_64_v3
#   - arm64: aarch64
#
# When PHLEX_SPACK_TARGET is not set, amd64:x86_64_v3 is assumed.
#
# Design notes:
#   - All packages default to target (x86_64_v3 or aarch64) and compiler gcc@13.
#     This covers root's own dependencies (e.g. zlib, python, xrootd)
#     which do not need to share the gcc@15 ABI of root itself.
#   - root and its dependents (phlex) require gcc@15 or clang depending on
#     architecture; those overrides are handled in each environment's spack.yaml
#     via spack config add commands applied before concretization.
#   - System zlib is declared external so Spack does not build its own
#     zlib / zlib-ng, eliminating duplicate virtual-provider builds.
#   - PHLEX_SPACK_TARGET is set via spack config add in entrypoint.sh before
#     concretization, and here via Spack variable substitution when the
#     packages.yaml is read from the environment.

packages:
  all:
    # Target and compiler are set at runtime via spack config add in entrypoint.sh
    # This provides architecture-aware configuration without modifying this file.
    providers:
      "zlib-api:": [zlib]
    # Apply PHLEX_SPACK_TARGET to all packages via Spack variable substitution
    target: ${PHLEX_SPACK_TARGET}

  c:
    prefer: ["gcc@13"]
  cxx:
    prefer: ["gcc@13"]
  fortran:
    prefer: ["gcc@13"]

  # Use the system zlib rather than building zlib / zlib-ng from source.
  # The external entry must match the Ubuntu 24.04 package layout.
  zlib:
    externals:
      - spec: zlib@1.3
        prefix: /usr
    buildable: false
  zlib-ng:
    buildable: false
