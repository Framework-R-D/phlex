# ######################################################################
# Spack environment configuration for Phlex.
#
# Architecture-aware configuration via PHLEX_SPACK_TARGET environment
# variable (set in Dockerfile/DockerBuild):
#   - amd64: x86_64_v3 (GCC 15)
#   - arm64: aarch64 (Spack Clang)
#
# Compiler selection is driven by PHLEX_SPACK_COMPILER and PHLEX_DEFAULT_COMPILER:
#   - amd64 (CI): gcc@15 (default if not set, PHLEX_DEFAULT_COMPILER=gcc)
#   - arm64 (dev): clang (Spack-provided, PHLEX_DEFAULT_COMPILER=clang)
#
# When PHLEX_SPACK_TARGET is not set, architecture detection sets defaults:
#   - x86_64 -> x86_64_v3
#   - aarch64/arm64 -> aarch64
# ######################################################################

spack:
  specs:
    - phlex
    - catch2
    - cetmodules
    - cmake
    - lcov
    - ninja
    - py-gcovr
    - py-pytest-cov # Needed for Python coverage reports
    - py-pyyaml # Needed by run-clang-tidy --export-fixes to merge per-TU fix files
    - llvm@22.1.8 +zstd +llvm_dylib +link_llvm_dylib ~lldb

  view:
    default:
      root: .spack-env/view
      link: all
      projections:
        zstd: "{name}-{version}/{compiler.name}-{compiler.version}/{hash}"

  concretizer:
    unify: true
    reuse:
      from:
        - type: external
        - type: local
        - type: buildcache

  packages:
    cmake:
      require:
        - "~qtgui"
        - "@4:"
        - "target=${PHLEX_SPACK_TARGET}"

    llvm:
      require:
        - "@22.1.8"
        - "target=${PHLEX_SPACK_TARGET}"

    phlex:
      require:
        - "@develop"
        - "+form"
        - "cxxstd=23"
        - "target=${PHLEX_SPACK_TARGET}"

    py-cython:
      require:
        - "build_system=python_pip"
        - "target=${PHLEX_SPACK_TARGET}"

    py-gcovr:
      require:
        - "build_system=python_pip"
        - "target=${PHLEX_SPACK_TARGET}"

    py-pytest-cov:
      require:
        - "build_system=python_pip"
        - "target=${PHLEX_SPACK_TARGET}"

    py-pyyaml:
      require:
        - "build_system=python_pip"
        - "target=${PHLEX_SPACK_TARGET}"

    # Temporary version pin for C-API `char const *` consistency
    python:
      require:
        - "@3.12"
        - "target=${PHLEX_SPACK_TARGET}"

    # root and its dependents (phlex) must share a single ABI.
    # Compiler selection is driven by PHLEX_DEFAULT_COMPILER:
    #   - amd64 (CI): gcc@15 (PHLEX_DEFAULT_COMPILER=gcc)
    #   - arm64 (dev): clang (PHLEX_DEFAULT_COMPILER=clang)
    root:
      require:
        - "~x" # No graphics libraries required
        - "cxxstd=23"
        - "target=${PHLEX_SPACK_TARGET}"

# Target and compiler defaults when PHLEX_SPACK_TARGET/PHLEX_SPACK_COMPILER
# are not set. These are applied via spack config add in entrypoint.sh.
# CI uses amd64:x86_64_v3:GCC; dev uses arm64:aarch64:Spack Clang.
config:
  concretizer:
    targets:
      arch: ${PHLEX_SPACK_TARGET}
    compiler:
      name: ${PHLEX_SPACK_COMPILER}
