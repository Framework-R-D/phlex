# ######################################################################
# In this environment, we specify that some packages be built with the
# native compiler (currently GCC ${PHLEX_NATIVE_GCC_VERSION}), and others with
# the compiler required to build Phlex (currently GCC ${PHLEX_GCC_VERSION}).
# ######################################################################

spack:
  specs:
    - phlex
    - catch2
    - cetmodules
    - cmake
    - lcov
    - ninja
    - py-gcovr
    - py-pytest-cov # Needed for Python coverage reports
    - py-pyyaml # Needed by run-clang-tidy --export-fixes to merge per-TU fix files
    - |
      llvm@${PHLEX_LLVM_VERSION} +zstd +llvm_dylib +link_llvm_dylib ~lldb targets=${PHLEX_LLVM_TARGET}

  view:
    default:
      root: .spack-env/view
      link: all
      projections:
        zstd: "{name}-{version}/{compiler.name}-{compiler.version}/{hash}"

  concretizer:
    unify: true
    reuse:
      from:
        - type: external
        - type: local
        - type: buildcache

  packages:
    cmake:
      require:
        - "~qtgui"
        - "@4:"
        - "target=${PHLEX_SPACK_TARGET}"

    llvm:
      require:
        - "targets=${PHLEX_LLVM_TARGET}"
        - "%c,cxx=gcc@${PHLEX_GCC_VERSION}"

    phlex:
      require:
        - "@develop"
        - "+form"
        - "cxxstd=23"
        - "%cxx=gcc@${PHLEX_GCC_VERSION}"
        - "^intel-tbb@2023.0.0:"

    py-cython:
      require:
        - "build_system=python_pip"

    py-gcovr:
      require:
        - "build_system=python_pip"

    py-pytest-cov:
      require:
        - "build_system=python_pip"

    py-pyyaml:
      require:
        - "build_system=python_pip"

    # Temporary version pin for C-API `char const *` consistency
    python:
      require:
        - "@3.12"

    # ROOT and its dependents (e.g. phlex) must be built with
    # ${PHLEX_GCC_VERSION} so they share a single ABI. ROOT's own
    # dependencies (e.g. zlib, python, xrootd) inherit the
    # gcc@${PHLEX_NATIVE_GCC_VERSION} native compiler dependency.
    #
    # ROOT should be built with the same version of the C++ standard
    # as will be used by Phlex (C++23 for now).
    root:
      require:
        - "~x" # No graphics libraries required
        - "cxxstd=23"
        - "%c,cxx=gcc@${PHLEX_GCC_VERSION}"
