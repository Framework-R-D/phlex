codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...90"

  status:
    project:
      default:
        flags:
          - amd64
        paths:
          - phlex/**
          - form/**
          - plugins/**
        target: 80%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        flags:
          - amd64
        paths:
          - phlex/**
          - form/**
          - plugins/**
        target: 80%
        threshold: 5%

component_management:
  individual_components:
    - component_id: framework
      name: Framework
      paths:
        - phlex/**
        - form/**
        - plugins/**
    - component_id: scripts
      name: Scripts
      paths:
        - scripts/**

flags:
  amd64:
    carryforward: true
  arm64:
    carryforward: true

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "test/**/*" # Ignore test files
  - "scripts/test/**/*" # Ignore scripts test helpers
  - "**/CMakeFiles/**" # Ignore CMake generated files
  - "build/**" # Ignore build directories (generic 1/3)
  - "build-*/**" # Ignore build directories (generic 2/3)
  - "*-build/**" # Ignore build directories (generic 3/3)
  - ".coverage-generated/**" # Ignore normalized symlink tree
  - "ci/**" # Ignore CI scripts
  - "docs/**" # Ignore documentation
  - "examples/**" # Ignore example code

github_checks:
  annotations: true
