# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Code Coverage
run-name: "${{ github.actor }} running code coverage"

"on":
  push:
    branches: [main, "release/*"]
  pull_request:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch to checkout. Defaults to the repository's default branch."
        required: false
        type: string
      source-sha:
        description: "Exact 40-character commit SHA to analyze; required for workflow_dispatch."
        required: true
        type: string
      repo:
        description: "Repository to checkout; manual runs must target this repository."
        required: false
        type: string
      pr-base-sha:
        description: "The base SHA for diffing (PR base). Defaults to event-provided value."
        required: false
        type: string
      phlex-coverage-compiler:
        description: "Compiler to use for coverage build (gcc or clang)"
        required: false
        default: "clang"
      phlex-enable-form:
        description: "Enable FORM integration (set to OFF to exclude FORM sources)"
        required: false
        default: "ON"

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, format('@{0}bot coverage', github.event.repository.name))
      )
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.setup.outputs.is_act }}
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      base_sha: ${{ steps.setup.outputs.base_sha }}
      pr_number: ${{ steps.setup.outputs.pr_number }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      build_path: ${{ steps.setup.outputs.build_path }}
      has_changes: ${{ steps.source_relevance.outputs.has_changes }}
      source_sha: ${{ steps.source_snapshot.outputs.source_sha }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          ref: ${{ inputs.ref }}
          repo: ${{ inputs.repo }}
          pr-base-sha: ${{ inputs.pr-base-sha }}
      - name: Validate immutable source snapshot
        id: source_snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_SHA: ${{ inputs.source-sha }}
          TARGET_REF: ${{ steps.setup.outputs.ref }}
          TARGET_REPO: ${{ steps.setup.outputs.repo }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const shaPattern = /^[0-9a-f]{40}$/i;
            let sourceSha;

            if (context.eventName === 'workflow_dispatch') {
              const requestedSha = process.env.REQUESTED_SHA;
              const targetRef = process.env.TARGET_REF.replace(/^refs\/heads\//, '');
              const selectedRef = context.ref.replace(/^refs\/heads\//, '');
              if (!shaPattern.test(requestedSha) || process.env.TARGET_REPO !== `${owner}/${repo}` ||
                  !context.ref.startsWith('refs/heads/') || targetRef !== selectedRef ||
                  process.env.WORKFLOW_REF.split('@').pop() !== context.ref ||
                  requestedSha.toLowerCase() !== context.sha.toLowerCase()) {
                throw new Error('Manual runs require this branch, repository, workflow ref, and full source SHA.');
              }
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: targetRef });
              if (branch.commit.sha.toLowerCase() !== requestedSha.toLowerCase()) {
                throw new Error('The selected branch head does not match source-sha.');
              }
              sourceSha = branch.commit.sha;
            } else if (context.eventName === 'issue_comment') {
              const prefix = `@${repo}bot coverage`;
              const body = process.env.COMMENT_BODY.trim();
              const match = body.match(new RegExp(`^${prefix}(?: --sha=([0-9a-f]{40}))?$`));
              if (!match) throw new Error('Use the coverage command without arguments.');
              const approvedSha = match[1];
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.issue.number
              });
              if (pull.state !== 'open' ||
                  (approvedSha && pull.head.sha.toLowerCase() !== approvedSha.toLowerCase()) ||
                  pull.head.ref !== process.env.TARGET_REF ||
                  pull.head.repo?.full_name !== process.env.TARGET_REPO) {
                throw new Error('The PR head differs from the coverage target or optional SHA.');
              }
              sourceSha = pull.head.sha;
            } else if (context.eventName === 'pull_request') {
              sourceSha = context.payload.pull_request.head.sha;
            } else if (context.eventName === 'push') {
              sourceSha = context.sha;
            } else {
              throw new Error(`Unsupported coverage event: ${context.eventName}`);
            }

            core.setOutput('source_sha', sourceSha);
      - name: Detect relevant changes in immutable source snapshot
        id: source_relevance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source_snapshot.outputs.source_sha }}
          PR_NUMBER: >-
            ${{ steps.setup.outputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        with:
          script: |
            const matches = filename => {
              if (filename.startsWith('scripts/')) return false;
              const basename = filename.split('/').pop();
              return /\.(cpp|hpp)(\.in)?$/.test(basename) ||
                /^(CMakeLists\.txt|.*\.cmake)(\.in)?$/.test(basename) ||
                /\.py(\.in)?$/.test(basename);
            };
            let relevant = true;
            if (context.eventName === 'pull_request' || context.eventName === 'issue_comment') {
              try {
                const pullNumber = Number(process.env.PR_NUMBER);
                const expectedSha = process.env.SOURCE_SHA;
                const { data: before } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber
                });
                const sourceSha = expectedSha || before.head.sha;
                if (before.head.sha === sourceSha) {
                  const changedPaths = [];
                  for (let page = 1; ; page++) {
                    const { data: files } = await github.rest.pulls.listFiles({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pullNumber,
                      per_page: 100,
                      page
                    });
                    changedPaths.push(...files.map(file => file.filename));
                    if (files.length < 100 || page === 30) break;
                  }
                  const { data: after } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullNumber
                  });
                  relevant = after.head.sha !== sourceSha || changedPaths.length >= 3000 ||
                    changedPaths.some(matches);
                }
              } catch (error) {
                core.warning(`Could not verify PR relevance; running coverage conservatively: ${error.message}`);
                relevant = true;
              }
            } else if (context.eventName === 'push' && context.payload.before &&
                       !/^0+$/.test(context.payload.before)) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: context.payload.before,
                  head: context.sha
                });
                relevant = comparison.files?.length >= 300 ||
                  (comparison.files || []).some(file => matches(file.filename));
              } catch (error) {
                core.warning(`Could not verify push relevance; running coverage conservatively: ${error.message}`);
                relevant = true;
              }
            }
            core.setOutput('has_changes', String(relevant));

  coverage:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && needs.setup.outputs.has_changes == 'true'
    runs-on: ${{ matrix.runner }}
    name: Coverage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: >-
        ghcr.io/framework-r-d/phlex-ci:latest@sha256:d62317baa9f8b886da6db6250bdcc1d97d15bf85fb18b13d9842abafbfd82ce0

    steps:
      - name: Determine coverage options
        id: coverage_options
        shell: bash
        # yamllint disable rule:line-length
        env:
          REQUESTED_COMPILER:
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['phlex-coverage-compiler'] || '' }}
          REQUESTED_FORM:
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['phlex-enable-form'] || '' }}
        run: |
          set -euo pipefail
          compiler="${REQUESTED_COMPILER:-clang}"
          form="${REQUESTED_FORM:-ON}"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
          echo "enable_form=$form" >> "$GITHUB_OUTPUT"
        # yamllint enable

      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          persist-credentials: false

      - name: Setup build environment
        uses: Framework-R-D/action-setup-build-env@780fd75b00a291df6a42d9d2337651330ebdb907 # v1
        with:
          build-path: ${{ needs.setup.outputs.build_path }}

      - name: Announce CMake configuration
        run: echo "➡️ Configuring CMake for coverage..."

      - name: Configure CMake with GCC coverage
        id: configure_gcc
        if: ${{ steps.coverage_options.outputs.compiler == 'gcc' }}
        uses: Framework-R-D/action-configure-cmake@caba9b42770d8f3ad2d8f294ef82dd88fc2c10c6 # v2
        with:
          cpp-compiler: g++
          preset: coverage-gcc
          source-path: ${{ needs.setup.outputs.checkout_path }}
          build-path: ${{ needs.setup.outputs.build_path }}
          enable-form: ${{ steps.coverage_options.outputs.enable_form }}
          form-root-storage: ${{ steps.coverage_options.outputs.enable_form }}

      - name: Configure CMake with Clang coverage
        id: configure_clang
        if: ${{ steps.coverage_options.outputs.compiler == 'clang' }}
        uses: Framework-R-D/action-configure-cmake@caba9b42770d8f3ad2d8f294ef82dd88fc2c10c6 # v2
        with:
          cpp-compiler: clang++
          preset: coverage-clang
          source-path: ${{ needs.setup.outputs.checkout_path }}
          build-path: ${{ needs.setup.outputs.build_path }}
          enable-form: ${{ steps.coverage_options.outputs.enable_form }}
          form-root-storage: ${{ steps.coverage_options.outputs.enable_form }}

      - name: Unknown Compiler Error
        if:
          ${{ steps.coverage_options.outputs.compiler != 'gcc' && steps.coverage_options.outputs.compiler != 'clang' }}
        env:
          COMPILER: ${{ steps.coverage_options.outputs.compiler }}
        run: |
          echo "ERROR: Unknown compiler '${COMPILER}'. Must be 'gcc' or 'clang'."
          exit 1

      - name: Announce build
        run: echo "➡️ Building with coverage instrumentation..."

      - name: Build with coverage instrumentation
        id: build
        uses: Framework-R-D/action-build-cmake@30bca0b2d76e90cf1cc9e6e863aed5be505e7e61 # v1
        with:
          build-path: ${{ needs.setup.outputs.build_path }}

      - name: Run tests with coverage
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          . /entrypoint.sh

          echo "➡️ Running tests with coverage..."
          PROFILE_ROOT="$(pwd)/test/profraw"
          echo "Cleaning LLVM profile directory: $PROFILE_ROOT"
          rm -rf "$PROFILE_ROOT"
          mkdir -p "$PROFILE_ROOT"
          export LLVM_PROFILE_FILE="$PROFILE_ROOT/%m-%p.profraw"

          echo "::group::Running ctest for coverage"
          if ctest --progress --output-on-failure -j "$(nproc)"; then
            echo "::endgroup::"
            echo "✅ All tests passed."
          else
            echo "::endgroup::"
            echo "::error::Some tests failed."
            exit 1
          fi

      - name: Generate coverage reports (GCC)
        id: report_gcc
        if: ${{ steps.coverage_options.outputs.compiler == 'gcc' }}
        shell: bash
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          . /entrypoint.sh

          echo "➡️ Generating coverage reports for GCC..."
          echo "::group::Running coverage-gcov target"
          if cmake --build . --target coverage-gcov -v; then
            echo "::endgroup::"
            echo "✅ GCC coverage report generation succeeded."
          else
            echo "::endgroup::"
            echo "::error::GCC coverage report generation failed."
            exit 1
          fi

      - name: Generate coverage reports (Clang)
        id: report_clang
        if: ${{ steps.coverage_options.outputs.compiler == 'clang' }}
        shell: bash
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          . /entrypoint.sh

          echo "➡️ Generating coverage reports for Clang..."
          echo "::group::Running coverage-llvm target"
          if cmake --build . --target coverage-llvm -v; then
            echo "::endgroup::"
            echo "✅ Clang coverage report generation succeeded."
          else
            echo "::endgroup::"
            echo "::error::Clang coverage report generation failed."
            exit 1
          fi

      - name: Generate Python coverage report
        id: report_python
        if: ${{ steps.report_gcc.outcome != 'skipped' || steps.report_clang.outcome != 'skipped' }}
        shell: bash
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          . /entrypoint.sh

          echo "➡️ Generating Python coverage report..."
          echo "::group::Running coverage-python target"

          # Check if pytest-cov is available
          if python3 -c "import pytest_cov" 2>/dev/null; then
            if cmake --build . --target coverage-python -v; then
              echo "::endgroup::"
              echo "✅ Python coverage report generation succeeded."
            else
              echo "::endgroup::"
              echo "::warning::Python coverage report generation failed (non-fatal)."
            fi
          else
            echo "::endgroup::"
            echo "::notice::pytest-cov not available; skipping Python coverage report."
          fi

      - name: Capture coverage artifact availability
        id: coverage_outputs
        if: ${{ steps.report_gcc.outcome != 'skipped' || steps.report_clang.outcome != 'skipped' }}
        shell: bash
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          if [ -f coverage.xml ]; then
            echo "has_coverage_xml=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage_xml=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -d coverage-html ]; then
            echo "has_coverage_html=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage_html=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f coverage-llvm.info ]; then
            echo "has_coverage_llvm_info=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage_llvm_info=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f coverage-python.xml ]; then
            echo "has_coverage_python_xml=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage_python_xml=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unknown Coverage Report Error
        if: ${{ steps.report_gcc.outcome == 'skipped' && steps.report_clang.outcome == 'skipped' }}
        run: |
          echo "ERROR: No coverage report was generated. Must run either GCC or Clang coverage report step."
          exit 1

      - name: Prepare coverage artifact bundle
        if: ${{ steps.report_gcc.outcome != 'skipped' || steps.report_clang.outcome != 'skipped' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          SOURCE_REPO:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARCH: ${{ matrix.arch }}
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/coverage-artifacts"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          for file in \
            coverage-llvm.txt \
            coverage-llvm.info \
            coverage.profdata \
            coverage.xml \
            coverage.info \
            coverage.info.final \
            coverage-python.xml; do
            if [ -f "$file" ]; then
              cp "$file" "$ARTIFACT_DIR/"
            fi
          done
          if [ -d coverage-html ]; then cp -R coverage-html "$ARTIFACT_DIR/"; fi
          if [ -d coverage-python-html ]; then cp -R coverage-python-html "$ARTIFACT_DIR/"; fi
          python3 - "$ARTIFACT_DIR/provenance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          import os

          metadata = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_repo": os.environ["SOURCE_REPO"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "arch": os.environ["ARCH"],
          }
          if not metadata["source_repo"]:
              raise SystemExit("The source repository could not be resolved")
          Path(sys.argv[1]).write_text(json.dumps(metadata, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Detect artifact upload availability
        id: artifact_runtime
        if: ${{ steps.report_gcc.outcome != 'skipped' || steps.report_clang.outcome != 'skipped' }}
        shell: bash
        # yamllint disable rule:line-length
        run: |
          if [ "${GITHUB_ACTOR}" = "nektos/act" ] || [ "${ACT:-}" = "true" ]; then
            echo "::notice::Artifact upload disabled for local act executions."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            echo "::warning::ACTIONS_RUNTIME_TOKEN missing; continuing and trusting actions/upload-artifact to handle authentication."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        # yamllint enable

      - name: Install Node.js runtime for artifact publishing
        if:
          ${{ (steps.report_gcc.outcome != 'skipped' || steps.report_clang.outcome != 'skipped') &&
          steps.artifact_runtime.outputs.available == 'true' && github.actor != 'nektos/act' }}
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get update
          apt-get install -y nodejs

      - name: Upload coverage bundle
        if:
          ${{ (steps.report_gcc.outcome != 'skipped' || steps.report_clang.outcome != 'skipped') &&
          steps.artifact_runtime.outputs.available == 'true' && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-generated-${{ matrix.arch }}-${{ github.run_attempt }}
          path: coverage-artifacts/
          retention-days: 30

  coverage-comment-current:
    needs: [setup, coverage, coverage-upload]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_current: ${{ steps.current_source.outputs.is_current }}
    steps:
      - name: Verify the source branch still matches this run
        id: current_source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TARGET_REF: ${{ needs.setup.outputs.ref }}
          TARGET_REPO: ${{ needs.setup.outputs.repo }}
          PR_NUMBER: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.number || needs.setup.outputs.pr_number
            }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let isCurrent = true;
            if (context.eventName === 'pull_request' || context.eventName === 'issue_comment') {
              const pullNumber = context.eventName === 'pull_request'
                ? context.payload.pull_request.number
                : Number(process.env.PR_NUMBER);
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
              const expectedRepo = context.eventName === 'pull_request'
                ? context.payload.pull_request.head.repo?.full_name
                : process.env.TARGET_REPO;
              const expectedRef = context.eventName === 'pull_request'
                ? context.payload.pull_request.head.ref
                : process.env.TARGET_REF;
              isCurrent = pull.head.sha === process.env.SOURCE_SHA &&
                pull.head.ref === expectedRef &&
                pull.head.repo?.full_name === expectedRepo;
            } else if (context.eventName === 'workflow_dispatch') {
              const branchName = process.env.TARGET_REF.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: branchName });
              isCurrent = process.env.TARGET_REPO === `${owner}/${repo}` &&
                context.ref === `refs/heads/${branchName}` &&
                context.sha === process.env.SOURCE_SHA && branch.commit.sha === process.env.SOURCE_SHA;
            } else if (context.eventName === 'push' && context.ref.startsWith('refs/heads/')) {
              const branchName = context.ref.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: branchName });
              isCurrent = branch.commit.sha === process.env.SOURCE_SHA;
            }
            core.setOutput('is_current', String(isCurrent));
            if (!isCurrent) console.log('Skipping coverage upload for a moved source branch.');

  coverage-upload:
    needs: [setup, coverage]
    # Run after either matrix success or failure so each successful leg can
    # publish its own report without masking a failed architecture.
    if: >-
      always() && needs.setup.result == 'success' && needs.coverage.result != 'skipped' && needs.coverage.result !=
      'cancelled' && github.actor != 'nektos/act'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted Codecov CLI version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          path: codecov-tools
          sparse-checkout: .github/codecov/requirements.txt
          persist-credentials: false

      - name: Move trusted Codecov tools outside the workspace
        run: mv "$GITHUB_WORKSPACE/codecov-tools" "$RUNNER_TEMP/codecov-tools"

      - name: Check out source code for Codecov mapping
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          repository:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned Codecov CLI version
        id: codecov_cli
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from pathlib import Path

          requirements = Path(os.environ["RUNNER_TEMP"]) / "codecov-tools/.github/codecov/requirements.txt"
          version = "v11.3.2"
          if requirements.is_file():
              pins = [line.strip() for line in requirements.read_text(encoding="utf-8").splitlines()
                      if line.strip() and not line.lstrip().startswith("#")]
              match = (
                  re.fullmatch(r"codecov-cli==([0-9]+\.[0-9]+\.[0-9]+)", pins[0])
                  if len(pins) == 1 else None
              )
              if match is None:
                  raise SystemExit("Expected one exact codecov-cli version pin")
              version = f"v{match.group(1)}"
          print(f"version={version}")
          PY

      - name: Create trusted empty Codecov configuration
        run: printf '{}\n' > "$RUNNER_TEMP/codecov-upload.yml"

      - name: Find successful coverage producer attempts
        id: producer_attempts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const arch of ['amd64', 'arm64']) {
              let successfulAttempt = '';
              // Reruns retain artifacts from successful matrix legs in earlier attempts.
              for (let attempt = context.runAttempt; attempt >= 1; attempt--) {
                const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  attempt_number: attempt,
                  per_page: 100
                });
                const producer = data.jobs.find(job => job.name === `Coverage (${arch})`);
                if (producer?.status === 'completed' && producer.conclusion === 'success') {
                  successfulAttempt = String(attempt);
                  break;
                }
              }
              core.setOutput(`${arch}_attempt`, successfulAttempt);
            }

      - name: Create fresh coverage artifact staging directory
        id: artifact_staging
        run: |
          staging_root=$(mktemp -d "$RUNNER_TEMP/coverage-artifacts.XXXXXXXX")
          echo "root=$staging_root" >> "$GITHUB_OUTPUT"

      - name: Download amd64 coverage bundle
        id: download_amd64
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-generated-amd64-${{ steps.producer_attempts.outputs.amd64_attempt || 'missing-producer' }}
          path: ${{ steps.artifact_staging.outputs.root }}/coverage-generated-amd64

      - name: Download arm64 coverage bundle
        id: download_arm64
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-generated-arm64-${{ steps.producer_attempts.outputs.arm64_attempt || 'missing-producer' }}
          path: ${{ steps.artifact_staging.outputs.root }}/coverage-generated-arm64

      - name: Validate coverage artifact provenance and paths
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          SOURCE_REPO:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          AMD64_PRODUCER_ATTEMPT: ${{ steps.producer_attempts.outputs.amd64_attempt }}
          ARM64_PRODUCER_ATTEMPT: ${{ steps.producer_attempts.outputs.arm64_attempt }}
          AMD64_DOWNLOAD_OUTCOME: ${{ steps.download_amd64.outcome }}
          ARM64_DOWNLOAD_OUTCOME: ${{ steps.download_arm64.outcome }}
          ARTIFACT_ROOT: ${{ steps.artifact_staging.outputs.root }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_ROOT"])
          if root.is_symlink():
              raise SystemExit("Coverage artifact root must not be a symlink")
          expected_base = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_repo": os.environ["SOURCE_REPO"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["RUN_ID"],
          }
          if re.fullmatch(r"[0-9a-f]{40}", expected_base["source_sha"]) is None:
              raise SystemExit("Expected a full source SHA for the coverage artifact")

          for arch in ("amd64", "arm64"):
              report_dir = root / f"coverage-generated-{arch}"
              download_outcome = os.environ[f"{arch.upper()}_DOWNLOAD_OUTCOME"]
              producer_attempt = os.environ[f"{arch.upper()}_PRODUCER_ATTEMPT"]
              if download_outcome != "success" or not producer_attempt:
                  continue
              if not report_dir.exists() and not report_dir.is_symlink():
                  continue
              if report_dir.is_symlink() or not report_dir.is_dir():
                  raise SystemExit(f"Invalid coverage artifact directory: {report_dir}")
              manifest = report_dir / "provenance.json"
              if manifest.is_symlink() or not manifest.is_file():
                  raise SystemExit(f"Missing regular provenance manifest: {manifest}")
              metadata = json.loads(manifest.read_text(encoding="utf-8"))
              expected = {**expected_base, "arch": arch, "run_attempt": producer_attempt}
              if metadata != expected:
                  raise SystemExit(f"Coverage artifact provenance mismatch for {arch}")
              for name in ("coverage.xml", "coverage-llvm.info", "coverage-python.xml"):
                  report = report_dir / name
                  if report.is_symlink():
                      raise SystemExit(f"Coverage report must not be a symlink: {report}")
                  if report.exists() and (not report.is_file() or report.stat().st_size > 536870912):
                      raise SystemExit(f"Invalid or oversized coverage report: {report}")
              for name in ("coverage-html", "coverage-python-html"):
                  html = report_dir / name
                  if html.is_symlink():
                      raise SystemExit(f"Coverage HTML path must not be a symlink: {html}")
          PY

      - name: Determine coverage files for each architecture
        id: codecov_targets
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ARTIFACT_ROOT: ${{ steps.artifact_staging.outputs.root }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${ARTIFACT_ROOT:-coverage-artifacts}"
          ls -al "$ARTIFACT_ROOT" || true
          any_coverage=false
          missing_coverage=false

          for arch in amd64 arm64; do
            report_dir="$ARTIFACT_ROOT/coverage-generated-${arch}"
            download_outcome_var="${arch^^}_DOWNLOAD_OUTCOME"
            files=()
            for report in coverage.xml coverage-llvm.info coverage-python.xml; do
              if [ "${!download_outcome_var:-success}" = success ] && [ -f "${report_dir}/${report}" ]; then
                files+=("${report_dir}/${report}")
              fi
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "${arch}_found=false" >> "$GITHUB_OUTPUT"
              echo "${arch}_files=" >> "$GITHUB_OUTPUT"
              if [ "$COVERAGE_RESULT" = success ]; then
                echo "::error::Successful ${arch} coverage job has no downloaded coverage report."
                missing_coverage=true
              fi
            else
              any_coverage=true
              file_csv=$(IFS=,; printf '%s' "${files[*]}")
              echo "Codecov ${arch} upload targets: ${files[*]}"
              echo "${arch}_found=true" >> "$GITHUB_OUTPUT"
              echo "${arch}_files=${file_csv}" >> "$GITHUB_OUTPUT"
            fi
          done

          if [ "$any_coverage" = false ]; then
            echo "::error::No successful architecture produced a coverage report."
            exit 1
          fi

          has_html=false
          html_path=""
          for arch in amd64 arm64; do
            html_dir="$ARTIFACT_ROOT/coverage-generated-${arch}/coverage-html"
            if [ -d "$html_dir" ]; then
              has_html=true
              html_path="$html_dir"
              break
            fi
          done
          echo "has_html=${has_html}" >> "$GITHUB_OUTPUT"
          echo "html_path=${html_path}" >> "$GITHUB_OUTPUT"

          if [ "$missing_coverage" = true ]; then
            exit 1
          fi

      - name: Verify the source branch still matches this run
        id: current_source
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TARGET_REF: ${{ needs.setup.outputs.ref }}
          TARGET_REPO: ${{ needs.setup.outputs.repo }}
          PR_NUMBER: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.number || needs.setup.outputs.pr_number
            }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let isCurrent = true;
            if (context.eventName === 'pull_request' || context.eventName === 'issue_comment') {
              const pullNumber = context.eventName === 'pull_request'
                ? context.payload.pull_request.number
                : Number(process.env.PR_NUMBER);
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
              const expectedRepo = context.eventName === 'pull_request'
                ? context.payload.pull_request.head.repo?.full_name
                : process.env.TARGET_REPO;
              const expectedRef = context.eventName === 'pull_request'
                ? context.payload.pull_request.head.ref
                : process.env.TARGET_REF;
              isCurrent = pull.head.sha === process.env.SOURCE_SHA &&
                pull.head.ref === expectedRef &&
                pull.head.repo?.full_name === expectedRepo;
            } else if (context.eventName === 'workflow_dispatch') {
              const branchName = process.env.TARGET_REF.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: branchName });
              isCurrent = process.env.TARGET_REPO === `${owner}/${repo}` &&
                context.ref === `refs/heads/${branchName}` &&
                context.sha === process.env.SOURCE_SHA && branch.commit.sha === process.env.SOURCE_SHA;
            } else if (context.eventName === 'push' && context.ref.startsWith('refs/heads/')) {
              const branchName = context.ref.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: branchName });
              isCurrent = branch.commit.sha === process.env.SOURCE_SHA;
            }
            core.setOutput('is_current', String(isCurrent));
            if (!isCurrent) console.log('Skipping coverage upload for a moved source branch.');

      - name: Upload amd64 coverage to Codecov
        if: >-
          always() && steps.codecov_cli.outcome == 'success' && steps.codecov_targets.outputs.amd64_found == 'true' &&
          steps.current_source.outputs.is_current == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: ${{ steps.codecov_cli.outputs.version }}
          files: ${{ steps.codecov_targets.outputs.amd64_files }}
          flags: amd64
          name: phlex-framework-coverage-amd64
          fail_ci_if_error: true
          verbose: true
          root_dir: .
          cleanup: true
          disable_search: true
          plugins: noop
          codecov_yml_path: ${{ runner.temp }}/codecov-upload.yml
          override_commit: ${{ github.event_name == 'issue_comment' && needs.setup.outputs.source_sha || '' }}
          override_pr: ${{ github.event_name == 'issue_comment' && needs.setup.outputs.pr_number || '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload arm64 coverage to Codecov
        if: >-
          always() && steps.codecov_cli.outcome == 'success' && steps.codecov_targets.outputs.arm64_found == 'true' &&
          steps.current_source.outputs.is_current == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: ${{ steps.codecov_cli.outputs.version }}
          files: ${{ steps.codecov_targets.outputs.arm64_files }}
          flags: arm64
          name: phlex-framework-coverage-arm64
          fail_ci_if_error: true
          verbose: true
          root_dir: .
          cleanup: true
          disable_search: true
          plugins: noop
          codecov_yml_path: ${{ runner.temp }}/codecov-upload.yml
          override_commit: ${{ github.event_name == 'issue_comment' && needs.setup.outputs.source_sha || '' }}
          override_pr: ${{ github.event_name == 'issue_comment' && needs.setup.outputs.pr_number || '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish HTML coverage report
        if: >-
          always() && steps.codecov_targets.outputs.has_html == 'true' && steps.current_source.outputs.is_current ==
          'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-report-${{ github.run_attempt }}
          path: ${{ steps.codecov_targets.outputs.html_path }}/
          if-no-files-found: warn
          retention-days: 30

  coverage-complete:
    needs: [setup, coverage, coverage-upload, coverage-comment-current]
    if: >-
      always() && github.event_name == 'issue_comment' && needs.setup.result == 'success' &&
      needs.coverage-comment-current.outputs.is_current == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Cleanup old coverage comments
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.issue.number || '' }}
          MARKER: "<!-- coverage-comment -->"
        with:
          script: |
            const marker = process.env.MARKER;
            const pr = parseInt(process.env.PR_NUMBER, 10);
            if (isNaN(pr)) { console.log('No PR number, skipping cleanup'); process.exit(0); }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr
            });
            for (const c of comments) {
              if (c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
                console.log(`Deleted old comment ${c.id}`);
              }
            }

      - name: Comment on coverage completion
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            Coverage workflow completed.

            Source snapshot: `${{ needs.setup.outputs.source_sha }}`.
            To rerun against the current PR head, comment
            `@${{ github.event.repository.name }}bot coverage`.

            **Result:** ${{ (needs.coverage.result == 'failure' || needs.coverage-upload.result == 'failure')
              && '❌ Coverage analysis failed.'
              || (needs.coverage.result == 'cancelled' || needs.coverage-upload.result == 'cancelled')
              && '⚠️ Coverage analysis was cancelled.'
              || needs.coverage.result == 'success' && '✅ Coverage analysis passed.'
              || needs.coverage.result == 'skipped' && 'ℹ️ No relevant changes detected; coverage skipped.'
              || format('ℹ️ Coverage completed with status: {0}.', needs.coverage.result) }}

            See the workflow run for detailed results:
            [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            <!-- coverage-comment -->

      - name: Update PR comment reactions
        if: always()
        uses: Framework-R-D/action-complete-pr-comment@5d16749c32fbb7b15503f264dde6e3c98b90b4fb # v2
        with:
          status: ${{ needs.coverage-upload.result == 'failure' && 'failure' || needs.coverage.result }}
