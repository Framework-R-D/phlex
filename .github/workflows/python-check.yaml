name: Python Check
run-name: "${{ github.actor }} checking Python code"

permissions:
  contents: read
  pull-requests: read

"on":
  pull_request:
  push:
    branches: ["release/*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch whose current head must match source-sha. Defaults to the repository's default branch."
        required: false
        type: string
      source-sha:
        description: "Exact 40-character commit SHA to analyze; required for workflow_dispatch."
        required: true
        type: string
  workflow_call:
    inputs:
      checkout-path:
        description: "Path to check out code to"
        required: false
        type: string
      skip-relevance-check:
        description: "Bypass relevance check"
        required: false
        type: boolean
        default: false
      pr-base-sha:
        description: "Base SHA of the PR for relevance check"
        required: false
        type: string
      pr-head-sha:
        description: "Head SHA of the PR for relevance check"
        required: false
        type: string
      ref:
        description: "The branch, ref, or SHA to checkout"
        required: false
        type: string
      repo:
        description: "The repository to checkout from"
        required: false
        type: string
      source-sha:
        description: "Immutable source commit SHA for the workflow run"
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.setup.outputs.is_act }}
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      base_sha: ${{ steps.setup.outputs.base_sha }}
      pr_number: ${{ steps.setup.outputs.pr_number }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      has_changes: ${{ steps.source_relevance.outputs.has_changes }}
      source_sha: ${{ steps.source_snapshot.outputs.source_sha }}
      source_repo: ${{ steps.source_snapshot.outputs.source_repo }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          head-ref: ${{ inputs.pr-head-sha }}
          ref: ${{ inputs.ref }}
          repo: ${{ inputs.repo }}
          pr-base-sha: ${{ inputs.pr-base-sha }}
          checkout-path: ${{ inputs.checkout-path }}
      - name: Resolve immutable source snapshot
        id: source_snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_SHA: ${{ inputs.source-sha }}
          CALL_SOURCE_SHA: ${{ inputs.pr-head-sha }}
          TARGET_REF: ${{ steps.setup.outputs.ref }}
          TARGET_REPO: ${{ steps.setup.outputs.repo }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const shaPattern = /^[0-9a-f]{40}$/i;
            let sourceSha;
            let sourceRepo;

            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head;
              if (!head.repo) throw new Error('The PR source repository is unavailable.');
              sourceSha = head.sha;
              sourceRepo = head.repo.full_name;
            } else if (context.eventName === 'push') {
              sourceSha = context.sha;
              sourceRepo = `${owner}/${repo}`;
            } else if (context.eventName === 'workflow_dispatch') {
              const targetRef = process.env.TARGET_REF.replace(/^refs\/heads\//, '');
              const selectedRef = context.ref.replace(/^refs\/heads\//, '');
              if (!shaPattern.test(process.env.REQUESTED_SHA) ||
                  process.env.TARGET_REPO !== `${owner}/${repo}` ||
                  !context.ref.startsWith('refs/heads/') || targetRef !== selectedRef ||
                  process.env.WORKFLOW_REF.split('@').pop() !== context.ref ||
                  process.env.REQUESTED_SHA.toLowerCase() !== context.sha.toLowerCase()) {
                throw new Error('Manual runs require this branch, repository, workflow ref, and full source SHA.');
              }
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: targetRef });
              if (branch.commit.sha.toLowerCase() !== process.env.REQUESTED_SHA.toLowerCase()) {
                throw new Error('The selected branch head does not match source-sha.');
              }
              sourceSha = branch.commit.sha;
              sourceRepo = `${owner}/${repo}`;
            } else {
              sourceRepo = process.env.TARGET_REPO || `${owner}/${repo}`;
              const requestedSha = process.env.CALL_SOURCE_SHA || process.env.REQUESTED_SHA;
              if (requestedSha) {
                if (!shaPattern.test(requestedSha)) throw new Error('The reusable workflow source SHA is invalid.');
                sourceSha = requestedSha;
              } else {
                const [targetOwner, targetRepo] = sourceRepo.split('/');
                const { data: branch } = await github.rest.repos.getBranch({
                  owner: targetOwner,
                  repo: targetRepo,
                  branch: process.env.TARGET_REF
                });
                sourceSha = branch.commit.sha;
              }
            }

            core.setOutput('source_sha', sourceSha);
            core.setOutput('source_repo', sourceRepo);
      - name: Detect relevant changes in immutable source snapshot
        id: source_relevance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source_snapshot.outputs.source_sha }}
          SOURCE_REPO: ${{ steps.source_snapshot.outputs.source_repo }}
          PR_NUMBER: >-
            ${{ steps.setup.outputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        with:
          script: |
            const pythonSourcePath = path => path.endsWith('.py') && [
              'scripts/', 'ci/', '.devcontainer/', 'plugins/python/python/', 'test/python/'
            ].some(prefix => path.startsWith(prefix));
            const includesPath = path => pythonSourcePath(path) ||
              path === 'docs/source/conf.py' ||
              path.startsWith('.github/format-tools/') ||
              path === 'pyproject.toml' ||
              path === '.pre-commit-config.yaml' ||
              /^\.github\/workflows\/.+\.ya?ml$/.test(path);
            let relevant = true;
            const changedPaths = [];
            if (context.eventName === 'pull_request' || context.eventName === 'issue_comment') {
              try {
                const pullNumber = Number(process.env.PR_NUMBER);
                const { data: before } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber
                });
                if (before.head.sha === process.env.SOURCE_SHA &&
                    before.head.repo?.full_name === process.env.SOURCE_REPO) {
                  for (let page = 1; ; page++) {
                    const { data: files } = await github.rest.pulls.listFiles({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pullNumber,
                      per_page: 100,
                      page
                    });
                    changedPaths.push(...files.map(file => file.filename));
                    if (files.length < 100 || page === 30) break;
                  }
                  const { data: after } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullNumber
                  });
                  relevant = after.head.sha !== process.env.SOURCE_SHA ||
                    after.head.repo?.full_name !== process.env.SOURCE_REPO ||
                    changedPaths.length >= 3000 || changedPaths.some(includesPath);
                }
              } catch (error) {
                core.warning(`Could not verify PR relevance; running checks conservatively: ${error.message}`);
                relevant = true;
              }
            } else if (context.eventName === 'push' && context.payload.before &&
                       !/^0+$/.test(context.payload.before)) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: context.payload.before,
                  head: process.env.SOURCE_SHA
                });
                relevant = comparison.files?.length >= 300 ||
                  (comparison.files || []).some(file => includesPath(file.filename));
              } catch (error) {
                core.warning(`Could not verify push relevance; running checks conservatively: ${error.message}`);
                relevant = true;
              }
            }
            core.setOutput('has_changes', String(relevant));

  python-check:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        inputs.skip-relevance-check ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.source_repo }}
          persist-credentials: false

      - name: Check out trusted Python tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: |
            .github/format-tools
            pyproject.toml
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version-file: workflow-tools/.github/format-tools/pyproject.toml

      - name: Install Python dependencies
        run: |
          uv sync --project workflow-tools/.github/format-tools --locked --no-build --group lint
          echo "$GITHUB_WORKSPACE/workflow-tools/.github/format-tools/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ruff check
        id: ruff
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        env:
          FORCE_COLOR: 1
        run: |
          echo "➡️ Checking Python code with ruff..."
          ruff check --config "$GITHUB_WORKSPACE/workflow-tools/pyproject.toml" .
        continue-on-error: true

      - name: Run ruff format check
        id: ruff_format
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        env:
          FORCE_COLOR: 1
        run: |
          ruff format --config "$GITHUB_WORKSPACE/workflow-tools/pyproject.toml" --check .
        continue-on-error: true

      - name: Run MyPy check
        id: mypy
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: |
          echo "➡️ Checking Python code with MyPy..."
          export MYPYPATH="$PWD/plugins/python/python:$PWD/scripts:$PWD/test/python"
          mypy --config-file "$GITHUB_WORKSPACE/workflow-tools/pyproject.toml" --color-output \
            scripts \
            ci \
            plugins/python/python \
            test/python \
            .devcontainer/configure-host.py \
            docs/source/conf.py
        continue-on-error: true

      - name: Evaluate Python checks result
        if: >
          always() && (
            steps.ruff.outcome != 'skipped' ||
            steps.ruff_format.outcome != 'skipped' ||
            steps.mypy.outcome != 'skipped'
          )
        env:
          REPO: ${{ needs.setup.outputs.repo }}
        # yamllint disable rule:line-length
        run: |
          REPO_NAME="${REPO##*/}"
          if [ "${{ steps.ruff.outcome }}" = 'success' ] && \
             [ "${{ steps.ruff_format.outcome }}" = 'success' ] && \
             [ "${{ steps.mypy.outcome }}" = 'success' ]; then
            echo "✅ Python checks passed."
          else
            echo "::error::Python checks failed. Comment '@${REPO_NAME}bot python-fix' on the PR to request a fix."
            exit 1
          fi
        # yamllint enable

  scripts-test:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        inputs.skip-relevance-check ||
        needs.setup.outputs.has_changes == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.source_repo }}
          persist-credentials: false

      - name: Check out trusted Python tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: .github/format-tools
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version-file: workflow-tools/.github/format-tools/pyproject.toml

      - name: Run scripts unit tests with coverage
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: |
          echo "➡️ Running scripts/ unit tests with coverage..."
          uv run --project "$GITHUB_WORKSPACE/workflow-tools/.github/format-tools" \
            --locked --no-build --group test \
            pytest scripts/test/ -v \
            --cov=scripts \
            --cov=ci \
            --cov=.devcontainer \
            --cov-report="xml:${GITHUB_WORKSPACE}/coverage-scripts.xml" \
            --cov-report=term-missing

      - name: Prepare scripts coverage artifact
        id: prepare_coverage
        if: ${{ hashFiles('coverage-scripts.xml') != '' }}
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          SOURCE_REPO: ${{ needs.setup.outputs.source_repo }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -L coverage-scripts.xml ] || [ ! -f coverage-scripts.xml ]; then
            echo "::error::Scripts coverage output must be a regular file."
            exit 1
          fi
          ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/coverage-scripts.XXXXXXXX")
          cp -- coverage-scripts.xml "$ARTIFACT_DIR/"
          python3 - "$ARTIFACT_DIR/provenance.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_repo": os.environ["SOURCE_REPO"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "arch": os.environ["ARCH"],
          }
          Path(sys.argv[1]).write_text(json.dumps(metadata, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload scripts coverage artifact
        if: steps.prepare_coverage.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-scripts-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_coverage.outputs.artifact_dir }}
          retention-days: 7
          if-no-files-found: error

  scripts-coverage-upload:
    needs: [setup, scripts-test]
    if: >-
      always() && needs.setup.result == 'success' && needs.scripts-test.result != 'skipped' && needs.scripts-test.result
      != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.setup.outputs.source_repo }}
          ref: ${{ needs.setup.outputs.source_sha }}
          path: ${{ needs.setup.outputs.checkout_path }}
          persist-credentials: false

      - name: Check out trusted Codecov CLI version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          path: codecov-tools
          sparse-checkout: .github/codecov/requirements.txt
          persist-credentials: false

      - name: Resolve pinned Codecov CLI version
        id: codecov_cli
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          requirements = Path("codecov-tools/.github/codecov/requirements.txt").read_text(encoding="utf-8")
          pins = [line.strip() for line in requirements.splitlines()
                  if line.strip() and not line.lstrip().startswith("#")]
          match = re.fullmatch(r"codecov-cli==([0-9]+\.[0-9]+\.[0-9]+)", pins[0]) if len(pins) == 1 else None
          if match is None:
              raise SystemExit("Expected one exact codecov-cli version pin")
          print(f"version=v{match.group(1)}")
          PY

      - name: Create trusted empty Codecov configuration
        run: printf '{}\n' > "$RUNNER_TEMP/codecov-upload.yml"

      - name: Download amd64 scripts coverage
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-scripts-amd64-${{ github.run_attempt }}
          path: coverage-scripts/amd64

      - name: Download arm64 scripts coverage
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-scripts-arm64-${{ github.run_attempt }}
          path: coverage-scripts/arm64

      - name: Validate scripts coverage artifacts
        id: coverage_artifacts
        if: always()
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          SOURCE_REPO: ${{ needs.setup.outputs.source_repo }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TEST_RESULT: ${{ needs.scripts-test.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_base = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_repo": os.environ["SOURCE_REPO"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
          }
          outputs = []
          for arch in ("amd64", "arm64"):
              report_dir = Path("coverage-scripts") / arch
              manifest = report_dir / "provenance.json"
              report = report_dir / "coverage-scripts.xml"
              exists = report_dir.exists() or report_dir.is_symlink()
              if not exists:
                  outputs.append(f"{arch}_found=false")
                  if os.environ["TEST_RESULT"] == "success":
                      raise SystemExit(f"Successful scripts test job has no {arch} coverage artifact")
                  continue
              if report_dir.is_symlink() or manifest.is_symlink() or report.is_symlink():
                  raise SystemExit(f"Scripts coverage artifact contains a symlink: {arch}")
              if not manifest.is_file() or not report.is_file() or report.stat().st_size > 536870912:
                  raise SystemExit(f"Invalid scripts coverage files for {arch}")
              if {entry.name for entry in report_dir.iterdir()} != {"provenance.json", "coverage-scripts.xml"}:
                  raise SystemExit(f"Unexpected files in scripts coverage artifact for {arch}")
              metadata = json.loads(manifest.read_text(encoding="utf-8"))
              if metadata != {**expected_base, "arch": arch}:
                  raise SystemExit(f"Scripts coverage provenance mismatch for {arch}")
              outputs.extend((f"{arch}_found=true", f"{arch}_file={report}"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(outputs) + "\n")
          PY

      - name: Verify the source branch is still current
        id: current_source
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          SOURCE_REPO: ${{ needs.setup.outputs.source_repo }}
          TARGET_REF: ${{ needs.setup.outputs.ref }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let isCurrent = true;
            if (context.eventName === 'pull_request') {
              const pull = context.payload.pull_request;
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pull.number });
              isCurrent = data.head.sha === process.env.SOURCE_SHA &&
                data.head.ref === pull.head.ref &&
                data.head.repo?.full_name === process.env.SOURCE_REPO;
            } else if (context.eventName === 'workflow_dispatch') {
              const branchName = process.env.TARGET_REF.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: branchName
              });
              isCurrent = process.env.SOURCE_REPO === `${owner}/${repo}` &&
                context.ref === `refs/heads/${branchName}` &&
                context.sha === process.env.SOURCE_SHA && branch.commit.sha === process.env.SOURCE_SHA;
            } else if ((context.eventName === 'issue_comment' || context.eventName === 'workflow_call') &&
                       process.env.PR_NUMBER) {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(process.env.PR_NUMBER)
              });
              isCurrent = data.head.sha === process.env.SOURCE_SHA &&
                data.head.ref === process.env.TARGET_REF &&
                data.head.repo?.full_name === process.env.SOURCE_REPO;
            } else if (context.eventName === 'push' && context.ref.startsWith('refs/heads/')) {
              const branchName = context.ref.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: branchName });
              isCurrent = branch.commit.sha === process.env.SOURCE_SHA && context.sha === process.env.SOURCE_SHA;
            } else if (context.eventName === 'workflow_call') {
              const [sourceOwner, sourceRepo] = process.env.SOURCE_REPO.split('/');
              const branchName = process.env.TARGET_REF.replace(/^refs\/heads\//, '');
              const { data: branch } = await github.rest.repos.getBranch({
                owner: sourceOwner,
                repo: sourceRepo,
                branch: branchName
              });
              isCurrent = branch.commit.sha === process.env.SOURCE_SHA;
            }
            core.setOutput('is_current', String(isCurrent));
            if (!isCurrent) console.log('Skipping coverage upload for a moved source branch.');

      - name: Upload amd64 scripts coverage to Codecov
        if: >-
          always() && steps.codecov_cli.outcome == 'success' && steps.coverage_artifacts.outputs.amd64_found == 'true'
          && steps.current_source.outputs.is_current == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: ${{ steps.codecov_cli.outputs.version }}
          files: ${{ steps.coverage_artifacts.outputs.amd64_file }}
          flags: amd64
          name: phlex-scripts-coverage-amd64
          fail_ci_if_error: false
          verbose: true
          root_dir: ${{ needs.setup.outputs.checkout_path }}
          cleanup: true
          disable_search: true
          plugins: noop
          codecov_yml_path: ${{ runner.temp }}/codecov-upload.yml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload arm64 scripts coverage to Codecov
        if: >-
          always() && steps.codecov_cli.outcome == 'success' && steps.coverage_artifacts.outputs.arm64_found == 'true'
          && steps.current_source.outputs.is_current == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: ${{ steps.codecov_cli.outputs.version }}
          files: ${{ steps.coverage_artifacts.outputs.arm64_file }}
          flags: arm64
          name: phlex-scripts-coverage-arm64
          fail_ci_if_error: false
          verbose: true
          root_dir: ${{ needs.setup.outputs.checkout_path }}
          cleanup: true
          disable_search: true
          plugins: noop
          codecov_yml_path: ${{ runner.temp }}/codecov-upload.yml
