name: CMake Build and Test
run-name: "${{ github.actor }} building and testing ${{ github.repository }}"

"on":
  pull_request:
  issue_comment:
    types: [created]
  push:
    branches: [main, "release/*"]
  schedule:
    - cron: "7 18 * * 6"
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, ref, or SHA to checkout. Defaults to the repository's default branch."
        required: false
        type: string
      source-sha:
        description: "Exact 40-character SHA at the selected branch head"
        required: true
        type: string
      build-combinations:
        description: |
          A space- or comma-separated list of build combinations to run.
          Syntax examples:
          - `gcc/asan clang/tsan` (run only these two)
          - `all` (run all combinations)
          - `all -clang/none -clang/valgrind` (run all except specified)
          - `+clang/none +clang/valgrind` (run default matrix plus specified)
          Default (if empty): Run `gcc/none`
        required: false
        default: ""
      perfetto_heap_profile:
        description: "Enable heap profiling for Perfetto runs"
        required: false
        type: boolean
        default: false
      perfetto_cpu_profile:
        description: "Enable CPU profiling for Perfetto runs"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      checkout-path:
        description: "Path to check out code to"
        required: false
        type: string
      build-path:
        description: "Path for build artifacts"
        required: false
        type: string
      skip-relevance-check:
        description: "Bypass relevance check"
        required: false
        type: boolean
        default: false
      build-combinations:
        description: "A space- or comma-separated list of build combinations to run"
        required: false
        type: string
      ref:
        description: "The branch, ref, or SHA to checkout"
        required: false
        type: string
      repo:
        description: "The repository to checkout from"
        required: false
        type: string
      pr-base-sha:
        description: "Base SHA of the PR for relevance check"
        required: false
        type: string
      pr-head-sha:
        description: "Head SHA of the PR for relevance check"
        required: false
        type: string
      source-sha:
        description: "Exact source SHA for manual or reusable runs"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  BUILD_TYPE: Release
  CICOLOR_FORCE: 1

jobs:
  setup:
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_call' || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, format('@{0}bot build', github.event.repository.name))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    outputs:
      is_act: ${{ steps.setup.outputs.is_act }}
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      base_sha: ${{ steps.setup.outputs.base_sha }}
      pr_number: ${{ steps.setup.outputs.pr_number }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      build_path: ${{ steps.setup.outputs.build_path }}
      has_changes: ${{ steps.source_relevance.outputs.has_changes }}
      source_sha: ${{ steps.source_snapshot.outputs.source_sha }}
      source_repo: ${{ steps.source_snapshot.outputs.source_repo }}
      build_combinations: ${{ steps.source_snapshot.outputs.command_args }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          ref: ${{ inputs.ref }}
          repo: ${{ inputs.repo }}
          pr-base-sha: ${{ inputs.pr-base-sha }}
          checkout-path: ${{ inputs.checkout-path }}
          build-path: ${{ inputs.build-path }}

      - name: Check out trusted source resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-tools
          sparse-checkout: .github/actions/resolve-source-snapshot
          persist-credentials: false

      - name: Resolve immutable source snapshot
        id: source_snapshot
        uses: ./workflow-tools/.github/actions/resolve-source-snapshot
        with:
          command: build
          ref: ${{ steps.setup.outputs.ref }}
          repo: ${{ steps.setup.outputs.repo }}
          source-sha: ${{ inputs.source-sha }}
          allow-arguments: true

      - name: Detect relevant changes in the immutable snapshot
        id: source_relevance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source_snapshot.outputs.source_sha }}
          SOURCE_REPO: ${{ steps.source_snapshot.outputs.source_repo }}
          SOURCE_BASE_SHA: ${{ steps.setup.outputs.base_sha }}
          PR_NUMBER: ${{ steps.setup.outputs.pr_number }}
          SKIP_RELEVANCE: ${{ inputs.skip-relevance-check }}
        with:
          script: |
            const matches = filename => {
              if (filename.startsWith('scripts/')) return false;
              const basename = filename.split('/').pop();
              return /\.(cpp|hpp)(\.in)?$/.test(basename) ||
                /^(CMakeLists\.txt|.*\.cmake)(\.in)?$/.test(basename);
            };
            let relevant = process.env.SKIP_RELEVANCE === 'true';
            if (!relevant && (context.eventName === 'pull_request' || context.eventName === 'issue_comment')) {
              try {
                const pullNumber = Number(process.env.PR_NUMBER || context.payload.pull_request?.number ||
                  context.payload.issue?.number);
                const { data: before } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber
                });
                if (!process.env.SOURCE_BASE_SHA || before.base.sha !== process.env.SOURCE_BASE_SHA ||
                    before.head.sha !== process.env.SOURCE_SHA ||
                    before.head.repo?.full_name !== process.env.SOURCE_REPO) {
                  relevant = true;
                } else {
                  const changedPaths = [];
                  for (let page = 1; ; page++) {
                    const { data: files } = await github.rest.pulls.listFiles({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pullNumber,
                      per_page: 100,
                      page
                    });
                    changedPaths.push(...files.map(file => file.filename));
                    if (files.length < 100 || page === 30) break;
                  }
                  const { data: after } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullNumber
                  });
                  relevant = after.head.sha !== process.env.SOURCE_SHA ||
                    after.base.sha !== process.env.SOURCE_BASE_SHA ||
                    after.head.repo?.full_name !== process.env.SOURCE_REPO ||
                    changedPaths.length >= 3000 || changedPaths.some(matches);
                }
              } catch (error) {
                core.warning(`Could not verify PR relevance; running the build conservatively: ${error.message}`);
                relevant = true;
              }
            } else if (!relevant && context.eventName === 'push' && context.payload.before &&
                       !/^0+$/.test(context.payload.before)) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: context.payload.before,
                  head: process.env.SOURCE_SHA
                });
                relevant = comparison.files?.length >= 300 ||
                  (comparison.files || []).some(file => matches(file.filename));
              } catch (error) {
                core.warning(`Could not verify push relevance; running the build conservatively: ${error.message}`);
                relevant = true;
              }
            } else if (!relevant) {
              relevant = true;
            }
            core.setOutput('has_changes', String(relevant));

  generate-matrix:
    needs: setup
    if: >
      needs.setup.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        inputs.skip-relevance-check ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand-arch.outputs.matrix }}
    steps:
      - id: generate
        uses: Framework-R-D/action-generate-build-matrix@a867325d7153f7fcc7d64fc69eafcb2b97edae39 # v1
        with:
          user-input: >-
            ${{ inputs.build-combinations || github.event.inputs.build-combinations ||
            needs.setup.outputs.build_combinations }}
          comment-body: ""

      - name: Expand architecture matrix
        # Cross each compiler/sanitizer combo with the supported architectures and
        # attach the matching runner label.  Perfetto profiling runs on both, as the
        # CI image installs the native tracebox prebuild for its own architecture.
        id: expand-arch
        shell: bash
        env:
          MATRIX_JSON: ${{ steps.generate.outputs.matrix }}
        run: |
          python3 - <<'PY'
          import json
          import os

          combos = json.loads(os.environ.get("MATRIX_JSON") or '{"include": []}').get("include", [])
          runners = {"amd64": "ubuntu-24.04", "arm64": "ubuntu-24.04-arm"}

          expanded = []
          for combo in combos:
              for arch, runner in runners.items():
                  expanded.append({**combo, "arch": arch, "runner": runner})

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              print("matrix=" + json.dumps({"include": expanded}), file=handle)
          PY

  build:
    needs: [setup, generate-matrix]
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        inputs.skip-relevance-check ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    container:
      image: >-
        ghcr.io/framework-r-d/phlex-ci:latest@sha256:d62317baa9f8b886da6db6250bdcc1d97d15bf85fb18b13d9842abafbfd82ce0
      options: --cap-add=SYS_PTRACE

    steps:
      - name: Check out code
        # The source resolver validates event SHAs, selected manual branch heads,
        # and explicit issue-comment approvals before this immutable checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ needs.setup.outputs.checkout_path }}
          ref: ${{ needs.setup.outputs.source_sha }}
          repository: ${{ needs.setup.outputs.source_repo }}
          persist-credentials: false

      - name: Setup build environment
        uses: Framework-R-D/action-setup-build-env@780fd75b00a291df6a42d9d2337651330ebdb907 # v1
        with:
          build-path: ${{ needs.setup.outputs.build_path }}

      - name: Announce CMake configuration
        run: echo "➡️ Configuring CMake..."

      - name: Configure CMake
        id: configure
        uses: Framework-R-D/action-configure-cmake@caba9b42770d8f3ad2d8f294ef82dd88fc2c10c6 # v2
        with:
          source-path: ${{ needs.setup.outputs.checkout_path }}
          build-path: ${{ needs.setup.outputs.build_path }}
          build-type: ${{ env.BUILD_TYPE }}
          cpp-compiler: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          extra-options: |
            ${{ matrix.sanitizer == 'asan' && '-DENABLE_ASAN=ON' || '' }}
            ${{ matrix.sanitizer == 'tsan' && '-DENABLE_TSAN=ON' || '' }}
            ${{ matrix.sanitizer == 'perfetto' && '-DENABLE_PERFETTO=ON' || '' }}

      - name: Build
        id: build
        uses: Framework-R-D/action-build-cmake@30bca0b2d76e90cf1cc9e6e863aed5be505e7e61 # v1
        with:
          build-path: ${{ needs.setup.outputs.build_path }}

      - name: Run tests
        if: matrix.sanitizer != 'valgrind' && matrix.sanitizer != 'perfetto'
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          . /entrypoint.sh

          echo "➡️ Running tests..."
          echo "::group::Running ctest"
          if ctest --progress --output-on-failure -j "$(nproc)"; then
            echo "::endgroup::"
            echo "✅ All tests passed."
          else
            echo "::endgroup::"
            echo "::error:: Some tests failed."
            exit 1
          fi

      - name: Run Valgrind tests
        if: matrix.sanitizer == 'valgrind'
        working-directory: ${{ needs.setup.outputs.build_path }}
        run: |
          . /entrypoint.sh

          echo "➡️ Running Valgrind tests..."
          echo "::group::Running ctest -T memcheck"
          if ctest -T memcheck; then
            echo "::endgroup::"
            echo "✅ Valgrind tests passed."
          else
            echo "::endgroup::"
            echo "⚠️ Valgrind tests failed, but the workflow will continue."
          fi

      - name: Run Perfetto profiling
        if: matrix.sanitizer == 'perfetto'
        working-directory: ${{ needs.setup.outputs.build_path }}
        env:
          PERFETTO_HEAP_PROFILE: ${{ inputs.perfetto_heap_profile }}
          PERFETTO_CPU_PROFILE: ${{ inputs.perfetto_cpu_profile }}
        run: |
          . /entrypoint.sh

          echo "➡️ Running tests with Perfetto profiling..."

          # Set perf_event_paranoid for CPU profiling
          if [ "$PERFETTO_CPU_PROFILE" = "true" ]; then
            echo "Configuring perf_event_paranoid for CPU profiling"
            echo -1 | tee /proc/sys/kernel/perf_event_paranoid 2>/dev/null || \
              echo "Warning: Could not set perf_event_paranoid"
          fi

          # Configure profiling based on environment
          TRACEBOX_ARGS=()
          if [ "$PERFETTO_HEAP_PROFILE" = "true" ]; then
            echo "Enabling heap profiling"
            TRACEBOX_ARGS+=(--app "*" --heapprofd)
          fi
          if [ "$PERFETTO_CPU_PROFILE" = "true" ]; then
            echo "Enabling CPU profiling"
            TRACEBOX_ARGS+=(--cpu-freq --cpu-idle --cpu-sched)
          fi

          # Run tests with or without tracebox wrapper
          TEST_RESULT=0
          if [ "${#TRACEBOX_ARGS[@]}" -gt 0 ]; then
            echo "::group::Running ctest with tracebox"
              tracebox "${TRACEBOX_ARGS[@]}" -o "perfetto-trace.pftrace" -- \
                ctest --progress --output-on-failure -j "$(nproc)" || TEST_RESULT=$?
          else
            echo "::group::Running ctest with Perfetto SDK tracing"
            ctest --progress --output-on-failure -j "$(nproc)" || TEST_RESULT=$?
          fi

          echo "::endgroup::"
          if [ "${TEST_RESULT:-0}" -eq 0 ]; then
            echo "✅ Perfetto profiling completed."
          else
            echo "::error:: Perfetto profiling failed."
            exit 1
          fi

      - name: Upload Perfetto traces
        if: matrix.sanitizer == 'perfetto'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perfetto-traces-${{ matrix.compiler }}-${{ matrix.arch }}
          path: |
            ${{ needs.setup.outputs.build_path }}/**/*.pftrace
          retention-days: 30
          if-no-files-found: warn

  cmake-build-skipped:
    needs: [setup]
    if: >
      needs.setup.result == 'success' && github.event_name != 'workflow_dispatch' && !inputs.skip-relevance-check &&
      needs.setup.outputs.is_act != 'true' && needs.setup.outputs.has_changes != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: No relevant C++ or CMake changes detected
        run: echo "::notice::No relevant C++ or CMake changes detected; build skipped."

  build-complete:
    needs: [setup, build]
    if: >
      always() && github.event_name == 'issue_comment' && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Comment on build completion
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          # yamllint disable rule:line-length
          message: |
            Build and test workflow completed.

            **Result:** ${{ needs.build.result == 'success' && '✅ All builds and tests passed.'
              || needs.build.result == 'failure' && '❌ Some builds or tests failed.'
              || needs.build.result == 'cancelled' && '⚠️ Build was cancelled before completion.'
              || needs.build.result == 'skipped' && 'ℹ️ No relevant C++ or CMake changes detected; build skipped.'
              || format('ℹ️ Build job completed with status: {0}.', needs.build.result) }}

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed results.
          # yamllint enable

      - name: Update PR comment reactions
        if: always()
        uses: Framework-R-D/action-complete-pr-comment@5d16749c32fbb7b15503f264dde6e3c98b90b4fb # v2
        with:
          status: ${{ needs.build.result }}
