name: Add issues to issues project

"on":
  issues:
    types:
      - opened

permissions: {}

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/Framework-R-D/projects/1
          github-token: ${{ secrets.PHLEX_ISSUES_PAT }}
