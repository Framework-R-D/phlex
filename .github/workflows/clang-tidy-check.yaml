name: Clang-Tidy Check
"run-name": "${{ github.actor }} checking C++ code with clang-tidy"

concurrency:
  group: clang-tidy-check-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  # Ignore incidental issue-comment invocations so they cannot cancel an active
  # pull-request analysis before the job-level command filter skips them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

"on":
  pull_request:
  push:
    branches: ["release/*"]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch matching this workflow run; source-sha must equal its current head."
        required: false
        type: string
      source-sha:
        description: "Exact 40-character SHA at the selected branch head"
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, format('@{0}bot tidy-check', github.event.repository.name))
      )
    outputs:
      is_act: ${{ steps.setup.outputs.is_act }}
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      base_sha: ${{ steps.setup.outputs.base_sha }}
      pr_number: ${{ steps.setup.outputs.pr_number }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      build_path: ${{ steps.setup.outputs.build_path }}
      has_changes: ${{ steps.source_relevance.outputs.has_changes }}
      source_sha: ${{ steps.source_snapshot.outputs.source_sha }}
      source_repo: ${{ steps.source_snapshot.outputs.source_repo }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1

      - name: Check out trusted source resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: .github/actions/resolve-source-snapshot
          persist-credentials: false

      - name: Resolve immutable source snapshot
        id: source_snapshot
        uses: ./workflow-tools/.github/actions/resolve-source-snapshot
        with:
          command: tidy-check
          ref: ${{ steps.setup.outputs.ref }}
          repo: ${{ steps.setup.outputs.repo }}
          source-sha: ${{ inputs.source-sha }}

      - name: Detect relevant changes in the immutable snapshot
        id: source_relevance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source_snapshot.outputs.source_sha }}
          SOURCE_REPO: ${{ steps.source_snapshot.outputs.source_repo }}
          PR_NUMBER: ${{ steps.setup.outputs.pr_number }}
        with:
          script: |
            const matches = filename => {
              if (filename.startsWith('scripts/')) return false;
              const basename = filename.split('/').pop();
              return /\.(cpp|hpp)(\.in)?$/.test(basename) ||
                /^(CMakeLists\.txt|.*\.cmake)(\.in)?$/.test(basename);
            };
            let relevant = true;
            if (context.eventName === 'pull_request' || context.eventName === 'issue_comment') {
              try {
                const pullNumber = Number(process.env.PR_NUMBER || context.payload.pull_request?.number ||
                  context.payload.issue?.number);
                const { data: before } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber
                });
                if (before.head.sha === process.env.SOURCE_SHA &&
                    before.head.repo?.full_name === process.env.SOURCE_REPO) {
                  const changedPaths = [];
                  for (let page = 1; ; page++) {
                    const { data: files } = await github.rest.pulls.listFiles({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pullNumber,
                      per_page: 100,
                      page
                    });
                    changedPaths.push(...files.map(file => file.filename));
                    if (files.length < 100 || page === 30) break;
                  }
                  const { data: after } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullNumber
                  });
                  relevant = after.head.sha !== process.env.SOURCE_SHA ||
                    after.head.repo?.full_name !== process.env.SOURCE_REPO ||
                    changedPaths.length >= 3000 || changedPaths.some(matches);
                }
              } catch (error) {
                core.warning(`Could not verify PR relevance; running clang-tidy conservatively: ${error.message}`);
                relevant = true;
              }
            } else if (context.eventName === 'push' && context.payload.before &&
                       !/^0+$/.test(context.payload.before)) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: context.payload.before,
                  head: process.env.SOURCE_SHA
                });
                relevant = comparison.files?.length >= 300 ||
                  (comparison.files || []).some(file => matches(file.filename));
              } catch (error) {
                core.warning(`Could not verify push relevance; running clang-tidy conservatively: ${error.message}`);
                relevant = true;
              }
            }
            core.setOutput('has_changes', String(relevant));

  clang-tidy-check:
    needs: setup
    # Pull-request runs must publish an empty issue artifact when all C/C++
    # changes have been reverted, allowing clang-tidy-report to remove a stale
    # warning comment.  The run step exits before invoking clang-tidy when no
    # C/C++ files remain to analyze.
    if: >
      always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      needs.setup.outputs.has_changes == 'true')
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/framework-r-d/phlex-ci:latest@sha256:d62317baa9f8b886da6db6250bdcc1d97d15bf85fb18b13d9842abafbfd82ce0

    steps:
      - name: Checkout code
        # The source resolver validates event SHAs, selected manual branch heads,
        # and explicit issue-comment approvals before this immutable checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.source_repo }}
          persist-credentials: false
          # The diff must start at the actual merge base, which may predate the
          # current base SHA for an unrebased pull request.
          fetch-depth: 0

      - name: Setup build environment
        uses: Framework-R-D/action-setup-build-env@780fd75b00a291df6a42d9d2337651330ebdb907 # v1
        with:
          build-path: ${{ needs.setup.outputs.build_path }}

      - name: Configure CMake
        uses: Framework-R-D/action-configure-cmake@caba9b42770d8f3ad2d8f294ef82dd88fc2c10c6 # v2
        with:
          preset: clang-tidy
          source-path: ${{ needs.setup.outputs.checkout_path }}
          build-path: ${{ needs.setup.outputs.build_path }}

      - name: Run clang-tidy
        id: tidy
        shell: bash
        working-directory: ${{ needs.setup.outputs.build_path }}
        env:
          BASE_SHA: ${{ needs.setup.outputs.base_sha }}
          BASE_REPO:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name ||
            needs.setup.outputs.repo }}
          HEAD_REPO:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          SOURCE_PATH: ${{ needs.setup.outputs.checkout_path }}
          BUILD_PATH: ${{ needs.setup.outputs.build_path }}
          FULL_BRANCH_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          . /entrypoint.sh
          SOURCE_DIR="$GITHUB_WORKSPACE/$SOURCE_PATH"
          BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_PATH"

          # Manual runs analyze the whole branch. Other events compare from the
          # actual merge base so an unrebased branch does not appear to modify
          # upstream changes that it simply has not incorporated yet.
          cd "$SOURCE_DIR"
          sources=()
          if [ "$FULL_BRANCH_CHECK" = true ]; then
            sources=("$SOURCE_DIR/phlex" "$SOURCE_DIR/form" "$SOURCE_DIR/plugins" "$SOURCE_DIR/test")
            : > "$BUILD_DIR/patch.diff"
          else
            FETCH_REMOTE="origin"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${BASE_REPO}" != "${HEAD_REPO}" ]; then
              FETCH_REMOTE="base-origin"
              git remote add "$FETCH_REMOTE" "https://github.com/${BASE_REPO}.git" 2>/dev/null || true
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags "$FETCH_REMOTE" "$BASE_SHA"
            fi
            DIFF_BASE=$(git merge-base "$BASE_SHA" HEAD)

            git diff --unified=0 "$DIFF_BASE" HEAD -- \
              '*.cpp' '*.hpp' '*.c' '*.h' '*.cxx' '*.cc' '*.hxx' '*.icc' \
              > "$BUILD_DIR/patch.diff"

            header_changed=false
            while IFS= read -r -d '' file; do
              if [ -f "$SOURCE_DIR/$file" ]; then
                case "$file" in
                  *.cpp|*.c|*.cxx|*.cc) sources+=("$SOURCE_DIR/$file") ;;
                  *.hpp|*.h|*.hxx|*.icc) header_changed=true ;;
                esac
              fi
            done < <(git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE" HEAD -- \
              '*.cpp' '*.hpp' '*.c' '*.h' '*.cxx' '*.cc' '*.hxx' '*.icc')

            # A header has no compilation database entry of its own.  Analyze all
            # project translation units when one changes so diagnostics in it are
            # observed through every potentially affected includer.
            if [ "$header_changed" = true ]; then
              sources=("$SOURCE_DIR/phlex" "$SOURCE_DIR/form" "$SOURCE_DIR/plugins" "$SOURCE_DIR/test")
            fi
          fi

          if [ "${#sources[@]}" -eq 0 ]; then
            : > "$BUILD_DIR/clang-tidy.log"
            : > "$BUILD_DIR/clang-tidy-new-issues.txt"
            : > "$BUILD_DIR/clang-tidy-analysis-complete.txt"
            echo "No C/C++ files to analyze"
            exit 0
          fi

          # Run from the source root so clang-tidy discovers .clang-tidy.  Passing
          # only changed paths avoids scanning unrelated translation units.
          if ! command -v run-clang-tidy >/dev/null 2>&1; then
            echo "::error::run-clang-tidy not found in PATH; cannot run clang-tidy checks"
            exit 1
          fi
          echo "➡️ Running clang-tidy checks..."
          set +e
          run-clang-tidy \
            -p "$BUILD_DIR" \
            -export-fixes "$BUILD_DIR/clang-tidy-fixes.yaml" \
            -j "$(nproc)" \
            "${sources[@]}" \
            > "$BUILD_DIR/clang-tidy.log" 2>&1
          TIDY_EXIT=$?
          set -e

          set +e
          filter_args=()
          if [ "$FULL_BRANCH_CHECK" = true ]; then
            filter_args+=(--all)
          fi
          python3 "$SOURCE_DIR/scripts/clang_tidy_diff_issues.py" \
            --log "$BUILD_DIR/clang-tidy.log" \
            --diff "$BUILD_DIR/patch.diff" \
            --source-dir "$SOURCE_DIR" \
            "${filter_args[@]}" \
            --output "$BUILD_DIR/clang-tidy-new-issues.txt"
          DIFF_EXIT=$?
          set -e

          if [ "$TIDY_EXIT" -ne 0 ] || grep -q \
            "No checks enabled\.\|Traceback\|RuntimeError\|ModuleNotFoundError\|ImportError" \
            "$BUILD_DIR/clang-tidy.log"; then
            echo "::error::run-clang-tidy failed (see log below)"
            echo "::group::clang-tidy.log (error)"
            cat "$BUILD_DIR/clang-tidy.log"
            echo "::endgroup::"
            exit 1
          elif [ "$DIFF_EXIT" -eq 1 ]; then
            : > "$BUILD_DIR/clang-tidy-analysis-complete.txt"
            NEW_COUNT=$(grep -c '' "$BUILD_DIR/clang-tidy-new-issues.txt" 2>/dev/null || echo 0)
            echo "::error::${NEW_COUNT} clang-tidy issue(s) found"
            while IFS= read -r issue; do
              [ -n "$issue" ] && echo "::error::${issue}"
            done < "$BUILD_DIR/clang-tidy-new-issues.txt"
            exit 1
          elif [ "$DIFF_EXIT" -ne 0 ]; then
            echo "::error::clang_tidy_diff_issues.py failed with exit code ${DIFF_EXIT}"
            exit "$DIFF_EXIT"
          else
            : > "$BUILD_DIR/clang-tidy-analysis-complete.txt"
            echo "✅ No clang-tidy issues found"
          fi

      - name: Save PR metadata
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          BUILD_PATH: ${{ needs.setup.outputs.build_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_PATH"
          mkdir -p "$BUILD_DIR"
          printf '%s\n' "$PR_NUMBER" > "$BUILD_DIR/pr_number.txt"

      - name: Prepare clang-tidy report artifact
        id: report_artifact
        if: always() && github.event_name == 'pull_request'
        env:
          BUILD_PATH: ${{ needs.setup.outputs.build_path }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          source = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["BUILD_PATH"]
          if source.is_symlink() or not source.is_dir():
              raise SystemExit("The clang-tidy build directory is invalid")
          artifact = Path(tempfile.mkdtemp(prefix="clang-tidy-report.", dir=os.environ["RUNNER_TEMP"]))
          limits = {
              "clang-tidy-analysis-complete.txt": 1024,
              "clang-tidy-new-issues.txt": 65536,
              "clang-tidy.log": 16777216,
          }
          for name, max_size in limits.items():
              candidate = source / name
              if candidate.is_symlink():
                  raise SystemExit(f"Refusing symlink report data: {name}")
              if candidate.exists():
                  if not candidate.is_file() or candidate.stat().st_size > max_size:
                      raise SystemExit(f"Invalid or oversized report data: {name}")
                  shutil.copyfile(candidate, artifact / name)
          (artifact / "pr_number.txt").write_text(os.environ["PR_NUMBER"] + "\n", encoding="utf-8")
          metadata = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_repo": os.environ["SOURCE_REPO"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
          }
          (artifact / "provenance.json").write_text(
              json.dumps(metadata, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"path={artifact}")
          PY

      - name: Upload artifacts
        if: always() && steps.report_artifact.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-tidy-check-${{ github.run_attempt }}
          path: |
            ${{ steps.report_artifact.outputs.path }}
          retention-days: 7
          if-no-files-found: error

  report:
    needs: [setup, clang-tidy-check]
    # pull_request events from forks have read-only GITHUB_TOKEN; the separate
    # clang-tidy-report.yaml workflow (triggered via workflow_run) handles
    # posting PR comments for pull_request events with the necessary write access.
    if: always() && needs.setup.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post Clang-Tidy results
        id: post_results
        uses: Framework-R-D/action-post-clang-tidy-results@81c1a8f0b9125c701c8535fb63a05b8fdb6d968e # v2
        with:
          build-path: ${{ needs.setup.outputs.build_path }}
          pr-number: ${{ needs.setup.outputs.pr_number }}
          post-summary: "true"

      - name: Update PR comment reactions
        if: always() && github.event_name == 'issue_comment'
        uses: Framework-R-D/action-complete-pr-comment@5d16749c32fbb7b15503f264dde6e3c98b90b4fb # v2
        with:
          status: ${{ needs.clang-tidy-check.result }}
