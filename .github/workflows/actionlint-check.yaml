name: Actionlint Check
run-name: "${{ github.actor }} checking GitHub Actions workflows"

permissions:
  contents: read
  pull-requests: read

"on":
  pull_request:
  push:
    branches: ["release/*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, ref, or SHA to checkout. Defaults to the repository's default branch."
        required: false
        type: string
  workflow_call:
    inputs:
      checkout-path:
        description: "Path to check out code to"
        required: false
        type: string
      skip-relevance-check:
        description: "Bypass relevance check"
        required: false
        type: boolean
        default: false
      pr-base-sha:
        description: "Base SHA of the PR for relevance check"
        required: false
        type: string
      pr-head-sha:
        description: "Head SHA of the PR for relevance check"
        required: false
        type: string
      ref:
        description: "The branch, ref, or SHA to checkout"
        required: false
        type: string
      repo:
        description: "The repository to checkout from"
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.setup.outputs.is_act }}
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      base_sha: ${{ steps.setup.outputs.base_sha }}
      pr_number: ${{ steps.setup.outputs.pr_number }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      has_changes: ${{ steps.setup.outputs.has_changes }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          include-globs: |
            .github/workflows/**/*.yml
            .github/workflows/**/*.yaml
            .github/actions/**/*.yml
            .github/actions/**/*.yaml
          head-ref: ${{ inputs.pr-head-sha }}
          ref: ${{ inputs.ref }}
          repo: ${{ inputs.repo }}
          pr-base-sha: ${{ inputs.pr-base-sha }}
          checkout-path: ${{ inputs.checkout-path }}

  actionlint-check:
    needs: setup
    if: >
      always() && (
        github.event_name == 'workflow_dispatch' ||
        inputs.skip-relevance-check ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || needs.setup.outputs.ref }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          persist-credentials: false

      - name: Announce actionlint check
        run: echo "➡️ Running actionlint check..."

      - name: Run actionlint
        id: lint
        continue-on-error: true
        env:
          CHECKOUT_PATH: ${{ needs.setup.outputs.checkout_path }}
          ACTIONLINT_IMAGE_URL: "rhysd/actionlint@sha256:7ef0d156288b43c3bd5ee96bac787a28aae53275e88e4f9476a64bc0c19195c9" # v1.7.12
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/${CHECKOUT_PATH}:/work" \
            -w /work \
             "${ACTIONLINT_IMAGE_URL}" \
            -config-file .github/actionlint.yaml

      - name: Evaluate actionlint result
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          if [ "${{ steps.lint.outcome }}" = 'success' ]; then
            echo "✅ actionlint check passed."
          else
            echo "::error::actionlint check failed. Please review the output above for details."
            exit 1
          fi

  gating_check:
    needs: setup
    if: >
      always() && (
        github.event_name == 'workflow_dispatch' ||
        inputs.skip-relevance-check ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository for governance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Framework-R-D/phlex
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name ==
            'workflow_call' && inputs.pr-base-sha || github.sha }}
          path: phlex
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || needs.setup.outputs.ref }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ||
            needs.setup.outputs.repo }}
          persist-credentials: false

      - name: Verify gating-block consistency
        env:
          CHECKOUT_PATH: ${{ needs.setup.outputs.checkout_path }}
        run: bash "phlex/scripts/check-gating-block.sh" "${CHECKOUT_PATH}/.github/workflows"
