name: Python Fix
run-name: "${{ github.actor }} fixing Python code"

"on":
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      ref:
        description:
          "The branch name to checkout and push fixes to (must be a branch, not a commit SHA). Defaults to the
          repository's default branch."
        required: false
        type: string
      source-sha:
        description: "Exact 40-character source SHA to format"
        required: true
        type: string
  workflow_call:
    inputs:
      checkout-path:
        description: "Path to check out code to"
        required: false
        type: string
      ref:
        description: "The branch name to checkout and push fixes to (must be a branch, not a commit SHA)"
        required: true
        type: string
      repo:
        description: "The repository to checkout from"
        required: true
        type: string
      skip-comment:
        description: "Skip posting PR comments"
        required: false
        type: boolean
        default: false
      source-sha:
        description: "Exact 40-character source SHA to format"
        required: false
        type: string
    outputs:
      changes:
        description: "Whether any fixes were applied"
        value: ${{ jobs.apply_fixes.outputs.changes }}
      pushed:
        description: "Whether the fixes were pushed to the remote branch"
        value: ${{ jobs.apply_fixes.outputs.pushed }}
      commit_sha:
        description: "The full commit SHA of the applied fixes"
        value: ${{ jobs.apply_fixes.outputs.commit_sha }}
      commit_sha_short:
        description: "The short commit SHA of the applied fixes"
        value: ${{ jobs.apply_fixes.outputs.commit_sha_short }}
      patch_name:
        description: "Name of the patch file if fixes could not be pushed"
        value: ${{ jobs.apply_fixes.outputs.patch_name }}

permissions:
  pull-requests: read
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Parse command
    if: >
      inputs.ref != '' || github.event_name == 'workflow_dispatch' || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, format('@{0}bot python-fix', github.event.repository.name))
      )
    outputs:
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      source_sha: ${{ steps.source_snapshot.outputs.source_sha }}
      source_repo: ${{ steps.source_snapshot.outputs.source_repo }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          mode: fix
          ref: ${{ inputs.ref }}
          repo: ${{ inputs.repo }}
          checkout-path: ${{ inputs.checkout-path }}

      - name: Check out trusted snapshot action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: .github/actions/resolve-fix-snapshot
          persist-credentials: false

      - name: Resolve approved source snapshot
        id: source_snapshot
        uses: ./workflow-tools/.github/actions/resolve-fix-snapshot
        with:
          command: python-fix
          ref: ${{ steps.setup.outputs.ref }}
          repo: ${{ steps.setup.outputs.repo }}
          source-sha: ${{ inputs.source-sha }}

  apply_fixes:
    runs-on: ubuntu-latest
    name: Apply fixes
    needs: setup
    if: needs.setup.result == 'success'
    outputs:
      changes: ${{ steps.prepare_patch.outputs.changes }}
      pushed: ${{ steps.prepare_patch.outputs.pushed }}
      commit_sha: ${{ steps.prepare_patch.outputs.commit_sha }}
      commit_sha_short: ${{ steps.prepare_patch.outputs.commit_sha_short }}
      patch_name: ${{ steps.prepare_patch.outputs.patch_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ needs.setup.outputs.checkout_path }}
          ref: ${{ needs.setup.outputs.source_sha }}
          repository: ${{ needs.setup.outputs.source_repo }}
          persist-credentials: false

      - name: Check out trusted Python tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: |
            .github/format-tools
            pyproject.toml
            scripts/create_fix_patch.py
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version-file: workflow-tools/.github/format-tools/pyproject.toml

      - name: Install Python dependencies
        run: |
          uv sync --project workflow-tools/.github/format-tools --locked --no-build --group lint
          echo "$GITHUB_WORKSPACE/workflow-tools/.github/format-tools/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ruff format and fix
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        env:
          FORCE_COLOR: 1
        run: |
          echo "Fixing Python format with ruff"
          ruff format --config "$GITHUB_WORKSPACE/workflow-tools/pyproject.toml" . || true
          echo "Fixing Python linter issues with ruff"
          ruff check --config "$GITHUB_WORKSPACE/workflow-tools/pyproject.toml" --fix . || true

      - name: Prepare patch artifact
        id: prepare_patch
        env:
          SOURCE_PATH: ${{ needs.setup.outputs.checkout_path }}
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          TARGET_REPO: ${{ needs.setup.outputs.source_repo }}
          TARGET_REF: ${{ needs.setup.outputs.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOOL: ruff
        run: python3 "$GITHUB_WORKSPACE/workflow-tools/scripts/create_fix_patch.py"

      - name: Upload patch artifact
        if: steps.prepare_patch.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare_patch.outputs.artifact_name }}
          path: ${{ steps.prepare_patch.outputs.artifact_path }}
          retention-days: 7
          if-no-files-found: error

  report:
    name: Report patch artifact
    needs: [setup, apply_fixes]
    if: >-
      github.event_name == 'issue_comment' && !inputs.skip-comment && needs.setup.result == 'success' &&
      needs.apply_fixes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-tools
          sparse-checkout: .github/actions/report-fix-patch
          persist-credentials: false

      - name: Report immutable patch result
        uses: ./workflow-tools/.github/actions/report-fix-patch
        with:
          tool: ruff
          source-sha: ${{ needs.setup.outputs.source_sha }}
          changes: ${{ needs.apply_fixes.outputs.changes }}
          patch-name: ${{ needs.apply_fixes.outputs.patch_name }}
          run-id: ${{ github.run_id }}
