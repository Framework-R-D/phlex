name: Repository Validation
run-name: "${{ github.actor }} running analysis and unit tests"

"on":
  pull_request:
  push:
    branches: ["release/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Static Analysis and Repository Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run analysis and repository checks
        uses: ./.github/actions/run-pre-commit
        with:
          category: validation

  scripts-test:
    name: Scripts, CI, and Devcontainer Unit Tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        uses: ./.github/actions/run-pre-commit
        with:
          category: tests
