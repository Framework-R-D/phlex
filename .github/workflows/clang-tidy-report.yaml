name: Clang-Tidy Report
"run-name": "Post clang-tidy results for ${{ github.event.workflow_run.head_branch }}"

# This workflow runs after the Clang-Tidy Check workflow completes and is
# responsible for posting clang-tidy results as PR comments.
#
# The Clang-Tidy Check workflow runs on pull_request events, which — for PRs
# from fork repositories — grants only read-only access to the GITHUB_TOKEN.
# Posting PR comments requires write access, so this separate workflow_run-
# triggered workflow is used instead: workflow_run events run in the base
# repository's context and can be granted pull-requests: write.

"on":
  workflow_run:
    workflows: ["Clang-Tidy Check"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    # Only run for pull_request events; issue_comment and workflow_dispatch
    # triggers are handled by the report job inside clang-tidy-check.yaml.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download clang-tidy artifacts
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clang-tidy-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
        continue-on-error: true

      - name: Locate artifacts and PR number
        id: locate
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          if [ "$DOWNLOAD_OUTCOME" = "failure" ]; then
            echo "::error::Artifact download failed — check token permissions or artifact expiry"
            exit 1
          fi

          pr_number_file=$(find artifacts -name "pr_number.txt" 2>/dev/null | head -1)
          if [ -n "$pr_number_file" ]; then
            pr_number=$(cat "$pr_number_file")
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pr_number.txt not found in downloaded artifacts; skipping PR comment"
          fi

          issues_file=$(find artifacts -name "clang-tidy-new-issues.txt" 2>/dev/null | head -1)
          if [ -n "$issues_file" ]; then
            echo "issues_file=$issues_file" >> "$GITHUB_OUTPUT"
          fi

          completion_file=$(find artifacts -name "clang-tidy-analysis-complete.txt" 2>/dev/null | head -1)
          if [ -n "$completion_file" ]; then
            echo "analysis_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::clang-tidy analysis did not complete; retaining any prior PR comment"
          fi

      - name: Update clang-tidy PR comment
        if: steps.locate.outputs.pr_number != '' && steps.locate.outputs.analysis_complete == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}#artifacts
          ISSUES_FILE: ${{ steps.locate.outputs.issues_file }}
          PR_NUMBER: ${{ steps.locate.outputs.pr_number }}
        with:
          script: |
            const marker = '<!-- phlex-clang-tidy-check -->';
            const legacyTitle = '## Clang-Tidy Check Results';
            const pr = parseInt(process.env.PR_NUMBER, 10);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });
            if (pull.head.sha !== context.payload.workflow_run.head_sha) {
              console.log('Skipping stale clang-tidy report for an older PR head.');
              return;
            }
            const fs = require('fs');
            const issuesFile = process.env.ISSUES_FILE;
            const issues = issuesFile && fs.existsSync(issuesFile)
              ? fs.readFileSync(issuesFile, 'utf8').trim()
              : '';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });

            // Also claim comments written by the previous reporting action, so a
            // clean run removes stale reports created before this workflow change.
            const previous = comments.filter(c =>
              c.body && (c.body.includes(marker) || c.body.startsWith(legacyTitle))
            );
            if (!issues) {
              for (const c of previous) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
              console.log('No new issues; removed prior clang-tidy comment(s).');
              return;
            }

            const body = [
              marker,
              '## Clang-Tidy Check Results',
              '',
              'Clang-tidy found the following issue(s) on lines changed by this pull request:',
              '',
              '```text',
              issues,
              '```',
              '',
              `[Download clang-tidy artifacts](${process.env.ARTIFACT_URL})`
            ].join('\n');

            if (previous.length) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous[0].id,
                body
              });
              for (const c of previous.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
              console.log(`Updated clang-tidy comment ${previous[0].id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
              console.log('Created clang-tidy comment.');
            }
