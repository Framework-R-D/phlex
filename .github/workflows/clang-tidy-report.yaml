name: Clang-Tidy Report
"run-name": "Post clang-tidy results for ${{ github.event.workflow_run.head_branch }}"

# This workflow runs after the Clang-Tidy Check workflow completes and is
# responsible for posting clang-tidy results as PR comments.
#
# The Clang-Tidy Check workflow runs on pull_request events, which — for PRs
# from fork repositories — grants only read-only access to the GITHUB_TOKEN.
# Posting PR comments requires write access, so this separate workflow_run-
# triggered workflow is used instead: workflow_run events run in the base
# repository's context and can be granted pull-requests: write.

"on":
  workflow_run:
    workflows: ["Clang-Tidy Check"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    # Only run for pull_request events; issue_comment and workflow_dispatch
    # triggers are handled by the report job inside clang-tidy-check.yaml.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download clang-tidy artifacts
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clang-tidy-check-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
        continue-on-error: true

      - name: Validate artifact provenance and source snapshot
        id: provenance
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = context.payload.workflow_run;
            const setOutputs = (values) => {
              for (const [name, value] of Object.entries(values)) core.setOutput(name, value);
            };
            if (process.env.DOWNLOAD_OUTCOME !== 'success') {
              core.warning('The clang-tidy artifact is unavailable; skipping the PR comment.');
              setOutputs({ ready: 'false' });
              return;
            }
            if (run.name !== 'Clang-Tidy Check' ||
                run.repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('The artifact producer is not the expected repository workflow.');
            }
            if (run.path !== '.github/workflows/clang-tidy-check.yaml' ||
                !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) {
              throw new Error('The artifact producer workflow path or attempt is invalid.');
            }
            if (!/^[0-9a-f]{40}$/i.test(run.head_sha || '') || !run.head_repository?.full_name) {
              throw new Error('The workflow run has no verifiable source repository and SHA.');
            }

            const file = name => path.join(process.env.GITHUB_WORKSPACE, 'artifacts', name);
            const requireRegularFile = (name, maxBytes) => {
              const target = file(name);
              let stats;
              try {
                stats = fs.lstatSync(target);
              } catch {
                return null;
              }
              if (!stats.isFile() || stats.isSymbolicLink() || stats.size > maxBytes) {
                throw new Error(`Invalid artifact file: ${name}`);
              }
              return target;
            };
            const numberFile = requireRegularFile('pr_number.txt', 32);
            const completionFile = requireRegularFile('clang-tidy-analysis-complete.txt', 1024);
            const issuesFile = requireRegularFile('clang-tidy-new-issues.txt', 65536);
            const manifestFile = requireRegularFile('provenance.json', 4096);
            if (!numberFile || !completionFile || !issuesFile || !manifestFile) {
              core.warning('The artifact is missing required PR, completion, findings, or provenance data.');
              setOutputs({ ready: 'false' });
              return;
            }
            const metadata = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
            const expectedMetadata = {
              source_sha: run.head_sha,
              source_repo: run.head_repository.full_name,
              run_id: String(run.id),
              run_attempt: String(run.run_attempt)
            };
            if (Object.keys(metadata).some(key => !Object.hasOwn(expectedMetadata, key)) ||
                Object.keys(expectedMetadata).some(key => metadata[key] !== expectedMetadata[key]) ||
                typeof metadata.workflow_ref !== 'string' ||
                !metadata.workflow_ref.includes('/.github/workflows/clang-tidy-check.yaml@')) {
              throw new Error('The clang-tidy artifact provenance does not match its workflow run.');
            }
            const allowedFiles = new Set([
              'clang-tidy-analysis-complete.txt', 'clang-tidy-new-issues.txt',
              'clang-tidy.log', 'pr_number.txt', 'provenance.json'
            ]);
            for (const entry of fs.readdirSync(path.join(process.env.GITHUB_WORKSPACE, 'artifacts'), {
              withFileTypes: true
            })) {
              if (!allowedFiles.has(entry.name) || !entry.isFile()) {
                throw new Error(`Unexpected file in clang-tidy artifact: ${entry.name}`);
              }
            }
            const numberText = fs.readFileSync(numberFile, 'utf8').trim();
            if (!/^[1-9][0-9]*$/.test(numberText)) {
              throw new Error('The artifact contains an invalid PR number.');
            }
            const prNumber = Number(numberText);
            const linkedPull = (run.pull_requests || []).find(pull => pull.number === prNumber);
            if (!linkedPull) {
              throw new Error('The artifact PR number is not linked to its producing workflow run.');
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const current = pull.head.sha === run.head_sha &&
              pull.head.ref === run.head_branch &&
              pull.head.repo?.full_name === run.head_repository.full_name &&
              (!linkedPull.head?.sha || linkedPull.head.sha === run.head_sha) &&
              (!linkedPull.head?.ref || linkedPull.head.ref === run.head_branch) &&
              (!linkedPull.head?.repo?.full_name ||
               linkedPull.head.repo.full_name === run.head_repository.full_name);
            if (!current) {
              console.log('Skipping stale clang-tidy artifacts for a moved PR head.');
              setOutputs({ ready: 'false' });
              return;
            }
            setOutputs({
              ready: 'true',
              pr_number: String(prNumber),
              issues_file: issuesFile || ''
            });

      - name: Update clang-tidy PR comment
        if: steps.provenance.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}#artifacts
          ISSUES_FILE: ${{ steps.provenance.outputs.issues_file }}
          PR_NUMBER: ${{ steps.provenance.outputs.pr_number }}
        with:
          script: |
            const marker = '<!-- phlex-clang-tidy-check -->';
            const legacyTitle = '## Clang-Tidy Check Results';
            const pr = parseInt(process.env.PR_NUMBER, 10);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });
            if (pull.head.sha !== context.payload.workflow_run.head_sha) {
              console.log('Skipping stale clang-tidy report for an older PR head.');
              return;
            }
            const fs = require('fs');
            const issuesFile = process.env.ISSUES_FILE;
            let issues = issuesFile && fs.existsSync(issuesFile)
              ? fs.readFileSync(issuesFile, 'utf8').trim()
              : '';
            if (Buffer.byteLength(issues, 'utf8') > 48000) {
              issues = Buffer.from(issues, 'utf8').subarray(0, 48000).toString('utf8') + '\n[truncated]';
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });

            // Also claim comments written by the previous reporting action, so a
            // clean run removes stale reports created before this workflow change.
            const previous = comments.filter(c =>
              c.body && (c.body.includes(marker) || c.body.startsWith(legacyTitle))
            );
            if (!issues) {
              for (const c of previous) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
              console.log('No new issues; removed prior clang-tidy comment(s).');
              return;
            }

            const backtickRuns = issues.match(/`+/g) || [];
            const fence = '`'.repeat(Math.max(3, ...backtickRuns.map(run => run.length + 1)));
            const body = [
              marker,
              '## Clang-Tidy Check Results',
              '',
              'Clang-tidy found the following issue(s) on lines changed by this pull request:',
              '',
              `${fence}text`,
              issues,
              fence,
              '',
              `[Download clang-tidy artifacts](${process.env.ARTIFACT_URL})`
            ].join('\n');

            if (previous.length) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous[0].id,
                body
              });
              for (const c of previous.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
              console.log(`Updated clang-tidy comment ${previous[0].id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
              console.log('Created clang-tidy comment.');
            }
