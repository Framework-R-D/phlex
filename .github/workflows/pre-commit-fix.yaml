name: Formatting Fix
run-name: "${{ github.actor }} fixing formatting"

"on":
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      ref:
        description: >
          The branch name to checkout and push fixes to (must be a branch, not a commit SHA). Defaults to the
          repository's default branch.
        required: false
        type: string

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Parse command
    if: >
      inputs.ref != '' || github.event_name == 'workflow_dispatch' || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, format('@{0}bot pre-commit-fix', github.event.repository.name)) ||
          startsWith(github.event.comment.body, format('@{0}bot format', github.event.repository.name))
        )
      )
    outputs:
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
    steps:
      - name: Workflow setup
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          mode: fix
          ref: ${{ inputs.ref }}

  apply_fixes:
    runs-on: ubuntu-latest
    name: Apply fixes
    needs: setup
    if: needs.setup.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}
          repository: ${{ needs.setup.outputs.repo }}
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Apply formatting
        id: format
        continue-on-error: true
        uses: ./.github/actions/run-pre-commit
        with:
          category: formatting

      - name: Commit and push fixes
        env:
          TARGET_REF: ${{ needs.setup.outputs.ref }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "style: apply automatic formatting"
            git push origin "HEAD:refs/heads/$TARGET_REF"
          fi

      - name: Verify formatting
        uses: ./.github/actions/run-pre-commit
        with:
          category: formatting

      - name: Update PR comment reactions
        if: always() && github.event_name == 'issue_comment'
        uses: Framework-R-D/action-complete-pr-comment@5d16749c32fbb7b15503f264dde6e3c98b90b4fb # v2
        with:
          status: ${{ job.status }}
